* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: calc(14px * var(--fs)) / 1.45 var(--font-ui);
  display: grid; grid-template-rows: 56px 40px 1fr; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--font-mono); font-size: calc(12.5px * var(--fs)); }

/* ---------- chrome ---------- */

.brand-logo { width: 78px; height: 40px; flex: none; }
.brand small { display: block; font-weight: 400; color: var(--chrome-muted); font-size: calc(11px * var(--fs)); line-height: 1.1; }
.topsearch { flex: 1; max-width: 640px; position: relative; }
.topsearch input { width: 100%; background: var(--chrome-3); border: 1px solid transparent; border-radius: 3px; padding: 7px 10px 7px 34px; color: var(--chrome-text); }
.topsearch input:focus { outline: none; border-color: var(--accent); }
.topsearch svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--chrome-muted); }
.top-actions { margin-left: auto; display: flex; gap: 4px; }
.icon-btn { background: none; border: 0; padding: 7px; border-radius: 4px; cursor: pointer; display: inline-grid; place-items: center; color: inherit; }
.icon-btn:hover { background: rgba(128,128,128,.18); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.burger { display: none; }
.crumbs { background: var(--chrome-2); color: var(--chrome-text); display: flex; align-items: center; gap: 10px; padding: 0 20px; font-size: calc(13px * var(--fs)); white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--nav-accent); }
.crumbs .sep { color: var(--chrome-muted); }

.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
.sidebar { background: var(--chrome-2); color: var(--chrome-text); overflow-y: auto; display: flex; flex-direction: column; border-right: 1px solid #000; }
.sidebar h2 { margin: 0; padding: 18px 20px; font-size: calc(16px * var(--fs)); border-bottom: 1px solid var(--chrome-3); }
.nav a, .nav .group { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: var(--chrome-text); border-left: 3px solid transparent; text-decoration: none; border-bottom: 1px solid var(--chrome-3); }
.nav a:hover { background: var(--chrome-3); }
.nav a.active { background: var(--chrome-3); border-left-color: var(--nav-accent); }
.nav .sub a { padding: 8px 20px 8px 40px; font-size: calc(13px * var(--fs)); border-bottom: 0; }
.nav .group { cursor: default; justify-content: space-between; }
.nav .count { margin-left: auto; background: var(--chrome-3); border-radius: 30px; padding: 0 8px; font-size: calc(12px * var(--fs)); color: var(--chrome-muted); }
.nav a.active .count { background: var(--chrome-2); }
.side-foot { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--chrome-3); display: grid; gap: 6px; font-size: calc(13px * var(--fs)); }
.side-foot button { background: none; border: 0; padding: 4px 0; text-align: left; color: var(--chrome-muted); cursor: pointer; }
.side-foot button:hover { color: var(--chrome-text); }
.store-status { color: var(--chrome-muted); font-size: calc(12px * var(--fs)); line-height: 1.4; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--chrome-3); overflow-wrap: anywhere; }
.store-status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.store-status code { color: var(--chrome-text); }
.files-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.files-head h4 { margin: 0 auto 0 0; font-size: calc(13px * var(--fs)); }
.btn-sm { padding: 3px 10px; font-size: calc(12.5px * var(--fs)); }
.file-list { border: 1px solid var(--border); max-height: 300px; overflow-y: auto; }
.file-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border); padding: 7px 10px; cursor: pointer; }
.file-row:last-child { border-bottom: 0; }
.file-row:hover { background: var(--surface-2); }
.file-row .p { font-family: var(--font-mono); font-size: calc(12.5px * var(--fs)); overflow-wrap: anywhere; }
.file-row .s { color: var(--muted); font-size: calc(12px * var(--fs)); white-space: nowrap; }
.fe-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.fe-grid.hist { grid-template-columns: 1fr 220px; }
.fe-hist { border: 1px solid var(--border); max-height: 420px; overflow-y: auto; }
.fe-hist button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border); padding: 8px 10px; cursor: pointer; font-size: calc(12.5px * var(--fs)); }
.fe-hist button:hover { background: var(--surface-2); }
.fe-hist button.on { background: var(--accent-soft); }
.fe-hist small { display: block; color: var(--muted); }
@media (max-width: 860px) { .fe-grid.hist { grid-template-columns: 1fr; } }

.main { overflow-y: auto; min-width: 0; position: relative; }
.page { padding: 24px; max-width: 1400px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { margin: 0; font-size: calc(24px * var(--fs)); font-weight: 500; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.page-head .spacer { flex: 1; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 3px; padding: 6px 14px; cursor: pointer; background: transparent; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { border-color: var(--accent); color: var(--accent); }
.btn-secondary:hover { background: var(--accent-soft); }
.btn-plain { color: var(--accent); }
.btn-plain:hover { background: var(--accent-soft); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.btn:disabled { opacity: .5; cursor: default; }
.input, .select, .textarea { background: var(--surface); border: 1px solid var(--border); border-bottom-color: var(--border-strong); border-radius: 2px; padding: 6px 9px; width: 100%; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent); }
.textarea { resize: vertical; min-height: 70px; font-family: var(--font-mono); font-size: calc(12.5px * var(--fs)); }
label.field { display: grid; gap: 4px; font-size: calc(13px * var(--fs)); font-weight: 600; }
label.field span.hint { font-weight: 400; color: var(--muted); font-size: calc(12px * var(--fs)); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface); padding: 12px 16px; border: 1px solid var(--border); margin-bottom: 20px; }
.toolbar .search { display: flex; }
.toolbar .search .input { width: 240px; border-right: 0; }
.toolbar .search button { border: 1px solid var(--border); background: var(--surface-2); padding: 0 10px; cursor: pointer; display: grid; place-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 30px; padding: 3px 12px; cursor: pointer; font-size: calc(13px * var(--fs)); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.toolbar .pager { margin-left: auto; color: var(--muted); font-size: calc(13px * var(--fs)); }
.toolbar .pager b { color: var(--text); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h3 { margin: 6px 0 0; font-size: calc(16px * var(--fs)); font-weight: 600; }
.card .ns { color: var(--muted); font-family: var(--font-mono); font-size: calc(12.5px * var(--fs)); overflow-wrap: anywhere; }
.card .desc { color: var(--muted); font-size: calc(13px * var(--fs)); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { margin-top: auto; padding-top: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.card .foot button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.card .foot button:hover { text-decoration: underline; }
.type-logo { width: 46px; height: 46px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: calc(14px * var(--fs)); letter-spacing: .5px; }
.t-ansible { background: var(--t-ansible); } .t-terraform { background: var(--t-terraform); } .t-eda { background: var(--t-eda); } .t-shell { background: var(--t-shell); } .t-python { background: var(--t-python); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: calc(11.5px * var(--fs)); padding: 1px 8px; border-radius: 30px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
.label { font-size: calc(12px * var(--fs)); padding: 1px 8px; border-radius: 30px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.label.success { color: var(--success); background: color-mix(in srgb, var(--success) 14%, transparent); }
.label.failed { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }

/* ---------- designer ---------- */
.main.designer { overflow: hidden; display: flex; flex-direction: column; }

.canvas-wrap { flex: 1; position: relative; overflow: hidden; background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 22px 22px; touch-action: none; }
#canvas { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
#canvas.panning { cursor: grabbing; }
.node { cursor: pointer; }
.node .hit { fill: transparent; }
.node-box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; transition: stroke .15s; }
.node:hover .node-box { stroke: var(--accent); }
.node.sel .node-box { stroke: var(--accent); stroke-width: 2.5; }
.node-title { fill: var(--text); font-size: 14px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.node-sub { fill: var(--muted); font-size: 11px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.badge circle { fill: var(--badge-bg); stroke: var(--surface); stroke-width: 2; }
.badge text { fill: #fff; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.badge.b-terraform circle { fill: var(--t-terraform); } .badge.b-eda circle { fill: var(--t-eda); } .badge.b-shell circle { fill: var(--t-shell); } .badge.b-python circle { fill: var(--t-python); } .badge.b-ansible circle { fill: #2b2e31; }
.start-box { fill: var(--accent); }
.start-text { fill: #fff; font-size: 16px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.port { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; cursor: crosshair; opacity: 0; transition: opacity .1s; }
.node:hover .port, .node.sel .port { opacity: 1; }
.port:hover { fill: var(--accent); stroke: var(--accent); }
.node-tools { opacity: 0; transition: opacity .1s; }
.node:hover .node-tools, .node.sel .node-tools { opacity: 1; }
.tool { cursor: pointer; }
.tool circle { fill: var(--surface); stroke: var(--border-strong); }
.tool:hover circle { fill: var(--accent); stroke: var(--accent); }
.tool path { stroke: var(--text); stroke-width: 1.8; fill: none; stroke-linecap: round; pointer-events: none; }
.tool:hover path { stroke: #fff; }
.tool.danger:hover circle { fill: var(--danger); stroke: var(--danger); }
.node.st-running .node-box { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 8 5; animation: dash 0.8s linear infinite; }
.node.st-success .node-box { stroke: var(--success); stroke-width: 3; }
.node.st-failed .node-box { stroke: var(--danger); stroke-width: 3; }
.node.st-skipped { opacity: .45; }
.node.st-skipped .node-box { stroke-dasharray: 4 4; }
.st-dot { pointer-events: none; }
@keyframes dash { to { stroke-dashoffset: -26; } }
.edge path.line { fill: none; stroke-width: 2; }
.edge.success path.line { stroke: var(--success); } .edge.failure path.line { stroke: var(--danger); } .edge.always path.line { stroke: var(--always); }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.edge:hover path.line { stroke-width: 3.5; }
.edge.sel path.line { stroke-width: 4; }
.edge.taken path.line { stroke-width: 4; }
.edge.flowing path.line { stroke-width: 4; stroke-dasharray: 10 7; animation: flow .55s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -17; } }
.edge .comet { pointer-events: none; filter: drop-shadow(0 0 3px rgba(0,0,0,.35)); }
.edge.success .comet { fill: var(--success); } .edge.failure .comet { fill: var(--danger); } .edge.always .comet { fill: var(--always); }
.node.start .start-box { transition: filter .15s; }
.node.start:hover .start-box { filter: brightness(1.12); }
.node.start.st-running .start-box { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.35) drop-shadow(0 0 6px var(--accent)); } }
@media (prefers-reduced-motion: reduce) {
  .edge.flowing path.line, .node.st-running .node-box, .node.start.st-running .start-box { animation: none; }
  .edge .comet { display: none; }
}
.d-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.d-main .canvas-wrap { min-height: 120px; }
.dock { flex: none; position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-top: 1px solid var(--border); }

.dock-empty { padding: 18px 16px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.dock-table { border: 0; font-size: calc(13px * var(--fs)); }

.dock-details { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 16px; }
.dd-col { display: grid; gap: 10px; align-content: start; min-width: 0; }

.dd-sub { font-size: calc(12px * var(--fs)); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
.dock-details code { font-size: calc(12px * var(--fs)); background: var(--surface-2); padding: 0 3px; border-radius: 2px; }
.edge.dim path.line { opacity: .3; }
.ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--surface); border: 1px solid var(--border); padding: 10px 14px; font-size: calc(12.5px * var(--fs)); display: grid; gap: 5px; box-shadow: var(--shadow); }
.legend.hidden { display: none; }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend i.ln { width: 22px; height: 3px; display: inline-block; border-radius: 2px; }

.hint-bar { position: absolute; right: 12px; bottom: 12px; color: var(--muted); font-size: calc(12px * var(--fs)); background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; }
.popover { position: absolute; z-index: 5; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,.25); padding: 10px; display: grid; gap: 6px; min-width: 190px; }

.popover button:hover { border-color: var(--accent); background: var(--accent-soft); }

.side { width: 380px; flex: none; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; display: none; }

.edge-row { display: grid; grid-template-columns: 1fr 120px 28px; gap: 6px; align-items: center; font-size: calc(13px * var(--fs)); }
.edge-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radio-row { display: flex; gap: 14px; font-size: calc(13px * var(--fs)); flex-wrap: wrap; }

.host-row:hover { background: var(--surface-2); }

.check-row { display: flex; gap: 8px; align-items: baseline; font-size: calc(13px * var(--fs)); flex-wrap: wrap; }

#auth { position: fixed; inset: 0; z-index: 100; background: var(--chrome); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.auth-card { background: var(--surface); width: min(420px, 100%); padding: 28px; display: grid; gap: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }

/* ---------- Sign-in: an 80s arcade screen in the logo's colours, whatever the theme ---------- */
#auth {
  --surface: #0b0806; --surface-2: #140f0b; --border: #5a4630; --border-strong: #8c7a52;
  --text: #f9f3c8; --muted: #b3a57c; --accent: #fcf704; --accent-hover: #fdfa8a; --on-accent: #000000; --danger: #fb3231;

}
.arcade { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }

.ar-stars.b { width: 3px; height: 3px; animation-delay: -1.6s; }
.ar-sun { position: absolute; left: 50%; top: 62vh; width: min(52vh, 70vw); aspect-ratio: 1; transform: translate(-50%, -62%); border-radius: 50%;
  background: linear-gradient(#fcf704, #ff9f1c 45%, #fb3231 75%); filter: drop-shadow(0 0 28px #fb323199);
  -webkit-mask: linear-gradient(#000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%, #000 67% 74%, transparent 74% 79%, #000 79% 85%, transparent 85%);
          mask: linear-gradient(#000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%, #000 67% 74%, transparent 74% 79%, #000 79% 85%, transparent 85%); }
.ar-floor { position: absolute; left: -50%; right: -50%; top: 62vh; bottom: 0; perspective: 26vh; perspective-origin: 50% 0; overflow: hidden;
  background: linear-gradient(#0b0a2a, #000 80%); border-top: 2px solid #3f95ff; box-shadow: 0 -2px 22px #0178f6bb; }

  background-image: linear-gradient(#0178f6 2px, transparent 2px), linear-gradient(90deg, #0178f6 2px, transparent 2px); background-size: 64px 64px;
  animation: ar-floor 5s linear infinite; }

  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.3) 2px 4px), radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.7) 100%);
  box-shadow: inset 0 0 120px rgba(0,0,0,.8); }

.auth-stage { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px 56px; width: min(1200px, 100%); }

<script>
'use strict';

/* =====================================================================
   Data model
   automation: { id, name, type, dir, entry, description, tags[], vars, group, action, updated }
   workflow:   { id, name, description, nodes[{id, automationId, x, y, label, action, vars,
                 convergence, inventoryFrom, inventoryId, limit, promptHosts, outcome}],
                 edges[{id, from, to, type}], updated }
   inventory:  { id, name, description, content (Ansible INI), updated }
               A node takes its hosts from its project inventory, a hub inventory (inventoryId)
               or a Terraform node (inventoryFrom); limit narrows them like ansible --limit.
   run:        { id, workflowId, workflowName, started, finished, status, nodes{id:status}, log[] }
   ===================================================================== */

function parseVars(text) {
  const out = {};
  String(text || '').split('\n').forEach(line => {
    const l = line.trim();
    if (!l || l.startsWith('#')) return;
    const i = l.indexOf('=');
    if (i > 0) out[l.slice(0, i).trim()] = l.slice(i + 1).trim();
  });
  return out;
}

async function api(method, path, body, opts = {}) {
  const r = await fetch(path, {
    method, keepalive: !!opts.keepalive,
    headers: body !== undefined ? { 'Content-Type': 'application/json', 'X-Hub': '1' } : { 'X-Hub': '1' },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : await r.blob();
  if (r.status === 401 && ME && !path.startsWith('/api/login')) { ME = null; showAuth('login', 'Your session ended. Sign in again.'); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function pixelSprite(rows, px) {
  let r = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (c === 'X') r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }));
  return `<svg width="${rows[0].length * px}" height="${rows.length * px}" viewBox="0 0 ${rows[0].length} ${rows.length}" fill="currentColor" shape-rendering="crispEdges">${r}</svg>`;
}

function arcadeScene() {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = list => list[Math.floor(Math.random() * list.length)];
  const stars = n => Array.from({ length: n }, () => `${rnd(0, 100).toFixed(1)}vw ${rnd(0, 60).toFixed(1)}vh ${pick(['#f9f3c8', '#f9f3c8', '#fcf704', '#3f95ff'])}`).join(',');
  const sprites = Array.from({ length: 10 }, (_, i) => {
    const d = rnd(45, 110);
    return `<div class="ar-sprite${i % 2 ? ' rev' : ''}" style="--y:${rnd(3, 52).toFixed(1)}vh;--c:${pick(ARCADE_COLOURS)};--d:${d.toFixed(0)}s;--delay:${(-rnd(0, d)).toFixed(0)}s;--x:${rnd(0, 92).toFixed(0)}vw">`
      + `<span style="animation-delay:-${rnd(0, 1.8).toFixed(1)}s">${pixelSprite(pick(ARCADE_SPRITES), Math.round(rnd(3, 6)))}</span></div>`;
  }).join('');
  return `<div class="arcade" aria-hidden="true">
    <div class="ar-stars" style="box-shadow:${stars(70)}"></div><div class="ar-stars b" style="box-shadow:${stars(25)}"></div>
    <div class="ar-sun"></div><div class="ar-floor"><i></i></div>${sprites}</div>`;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.automations)) return s; }
  } catch (e) { /* storage unavailable */ }
  return null;
}

// Stored files and validation results have their own endpoints, so they never count as a catalog change.
const docOf = (kind, o) => JSON.stringify(kind === 'automations' ? { ...o, files: undefined, validation: undefined } : o);
function snapshot() { KINDS.forEach(k => { synced[k] = new Map(state[k].map(o => [o.id, docOf(k, o)])); }); }

function persist() {
  updateCounts();
  if (!API.on) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
    return;
  }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => flushSync(), 120);
}

// Send only what changed since the last successful save, in one transaction.
function flushSync(extra = {}, keepalive = false) {
  clearTimeout(syncTimer); syncTimer = null;
  if (!API.on) return Promise.resolve();
  const body = { upsert: {}, delete: {}, ...extra };
  const next = {};
  let changes = 0;
  KINDS.forEach(k => {
    const cur = new Map(state[k].map(o => [o.id, docOf(k, o)]));
    body.upsert[k] = state[k].filter(o => synced[k].get(o.id) !== cur.get(o.id));
    body.delete[k] = [...synced[k].keys()].filter(id => !cur.has(id));
    changes += body.upsert[k].length + body.delete[k].length;
    next[k] = cur;
  });
  if (!changes && !extra.initialize) return syncChain;
  syncChain = syncChain
    .then(() => api('POST', '/api/sync', body, { keepalive: keepalive && JSON.stringify(body).length < 60000 }))
    .then(() => { synced = next; setStoreStatus(); })
    .catch(e => { setStoreStatus(e.message); toast('Database save failed: ' + e.message); });
  return syncChain;
}

async function refreshFromServer() {
  await flushSync();
  const s = await api('GET', '/api/state');
  setState(s);
  snapshot();
  updateCounts();
}

// Hubs saved before inventories existed have none.
function setState(s) {
  state = { automations: s.automations, workflows: s.workflows, runs: s.runs || [], inventories: s.inventories || [] };
}

function setStoreStatus(err) {
  const el = $('#storeStatus');
  if (!el) return;
  el.innerHTML = err ? `<i style="background:var(--danger)"></i>Database error: ${esc(err)}`
    : API.on ? `<i style="background:var(--success)"></i>SQLite · ${esc(API.db.split('/').slice(-2).join('/'))}`
    : `<i style="background:var(--warn)"></i>Browser storage only. Start <code>./runner.sh</code> for the database.`;
  el.title = API.on ? API.db : '';
}

  if (location.protocol.startsWith('http')) {
    let session = null;

    if (session) {

      if (s.initialized) {

let state = { automations: [], workflows: [], runs: [], inventories: [] };
let D = null; // designer session

// Approval steps point at this built-in entry instead of a catalog automation.
const APPROVAL = { id: '__approval', name: 'Approval', type: 'approval', dir: '', entry: '', vars: '', group: '', action: '', tags: [], files: [],
  description: 'Pauses the run until an approver approves it (the run continues on the success path) or rejects it (the failure path).' };
const CATALOG_TYPES = Object.keys(TYPES).filter(t => t !== 'approval');
const autoById = id => id === APPROVAL.id ? APPROVAL : state.automations.find(a => a.id === id);
const isApproval = n => n?.automationId === APPROVAL.id;
const wfById = id => state.workflows.find(w => w.id === id);
const invById = id => state.inventories.find(i => i.id === id);

/* =====================================================================
   Graph helpers
   ===================================================================== */
function startPos(wf) { return { x: wf.startX ?? 0, y: wf.startY ?? -START_H / 2 }; }
function boxOf(wf, id) {
  if (id === 'start') { const p = startPos(wf); return { x: p.x, y: p.y, w: START_W, h: START_H }; }
  const n = wf.nodes.find(n => n.id === id);
  return n ? { x: n.x, y: n.y, w: NODE_W, h: NODE_H } : null;
}
function canReach(wf, from, to) {
  const seen = new Set(), stack = [from];
  while (stack.length) {
    const c = stack.pop();
    if (c === to) return true;
    if (seen.has(c)) continue;
    seen.add(c);
    wf.edges.forEach(e => { if (e.from === c) stack.push(e.to); });
  }
  return false;
}
function topo(wf) {
  const ids = ['start', ...wf.nodes.map(n => n.id)];
  const indeg = Object.fromEntries(ids.map(i => [i, 0]));
  wf.edges.forEach(e => { if (e.to in indeg) indeg[e.to]++; });
  const q = ids.filter(i => indeg[i] === 0), order = [];
  while (q.length) {
    const c = q.shift();
    order.push(c);
    wf.edges.filter(e => e.from === c).forEach(e => { if (--indeg[e.to] === 0) q.push(e.to); });
  }
  return order;
}
function nodeName(n) { const a = autoById(n.automationId); return n.label || (a ? a.name : 'Missing automation'); }
function nodeAction(n) { const a = autoById(n.automationId); return n.action || (a && a.action) || 'apply'; }

function autoLayout(wf) {
  const order = topo(wf), depth = { start: 0 };
  order.forEach(id => wf.edges.filter(e => e.from === id).forEach(e => {
    depth[e.to] = Math.max(depth[e.to] ?? 0, (depth[id] ?? 0) + 1);
  }));
  wf.nodes.forEach(n => { if (depth[n.id] == null) depth[n.id] = 1; });
  const cols = {};
  wf.nodes.forEach(n => (cols[depth[n.id]] ||= []).push(n));
  const centerY = {};
  centerY.start = 0;
  wf.startX = 0; wf.startY = -START_H / 2;
  Object.keys(cols).map(Number).sort((a, b) => a - b).forEach(d => {
    const col = cols[d];
    const bary = n => {
      const ps = wf.edges.filter(e => e.to === n.id && centerY[e.from] != null).map(e => centerY[e.from]);
      return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0;
    };
    col.sort((a, b) => bary(a) - bary(b));
    col.forEach((n, i) => {
      const c = (i - (col.length - 1) / 2) * 110;
      n.x = START_W + 70 + (d - 1) * 290;
      n.y = c - NODE_H / 2;
      centerY[n.id] = c;
    });
  });
}

/* =====================================================================
   Inventories: stored as Ansible INI text and parsed here for host pickers,
   checks and the runner. Uploads in other formats are converted to INI.
   ===================================================================== */
function expandHostRange(name) {
  const m = name.match(/^(.*)\[(\d+):(\d+)\](.*)$/);
  if (!m) return [name];
  const out = [];
  for (let i = +m[2]; i <= +m[3] && out.length < 1000; i++) out.push(m[1] + String(i).padStart(m[2].length, '0') + m[4]);
  return out;
}

function parseInventory(content) {
  const hosts = new Map(), groups = { ungrouped: [] }, children = {}, problems = [];
  let cur = 'ungrouped', mode = 'hosts';
  String(content || '').split('\n').forEach((raw, i) => {
    const line = raw.trim().replace(/\s#.*$/, '');
    if (!line || '#;'.includes(line[0])) return;
    if (line[0] === '[') {
      const m = line.match(/^\[([^\]:\s]+)(?::(\w+))?\]$/);
      if (!m) { problems.push({ line: i + 1, text: `Malformed group header: ${line}` }); return; }
      cur = m[1]; mode = m[2] || 'hosts';
      groups[cur] ||= [];
      return;
    }
    if (mode === 'children') { (children[cur] ||= []).push(line.split(/\s+/)[0]); return; }
    if (mode !== 'hosts') return;
    const name = line.split(/\s+/)[0], vars = {};
    for (const m of line.slice(name.length).matchAll(/([^\s=]+)=("(?:[^"\\]|\\.)*"|'[^']*'|\S+)/g))
      vars[m[1]] = /^["']/.test(m[2]) ? m[2].slice(1, -1) : m[2];
    expandHostRange(name).forEach(h => {
      const rec = hosts.get(h) || { vars: {}, groups: new Set() };
      Object.assign(rec.vars, vars);
      rec.groups.add(cur);
      hosts.set(h, rec);
      if (!groups[cur].includes(h)) groups[cur].push(h);
    });
  });
  return { hosts, groups, children, problems };
}

function hostsOf(inv, group, seen = new Set()) {
  if (seen.has(group)) return [];
  seen.add(group);
  const out = new Set(inv.groups[group] || []);
  (inv.children[group] || []).forEach(c => hostsOf(inv, c, seen).forEach(h => out.add(h)));
  return [...out];
}

function groupNames(inv) {
  return [...new Set([...Object.keys(inv.groups), ...Object.keys(inv.children)])]
    .filter(g => g !== 'all' && (g !== 'ungrouped' || inv.groups.ungrouped.length));
}

// Terms of an Ansible host pattern; ':' separates terms too, except inside IPv6 addresses.
function limitTerms(limit) {
  return String(limit || '').split(/[,\s]+/).flatMap(p => (p.match(/:/g) || []).length === 1 ? p.split(':') : [p]).filter(Boolean);
}

// Which hosts a --limit pattern selects: names, groups, globs, ~regex, !exclude and &intersect.
function resolveLimit(inv, limit) {
  const every = [...inv.hosts.keys()];
  const names = new Set([...Object.keys(inv.groups), ...Object.keys(inv.children)]);
  const match = t => {
    if (t === 'all' || t === '*') return new Set(every);
    if (names.has(t)) return new Set(hostsOf(inv, t));
    let rx = null;
    try {
      if (t[0] === '~') rx = new RegExp(t.slice(1));
      else if (/[*?[]/.test(t)) rx = new RegExp('^' + t.replace(/[.+^${}()|\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
    } catch (e) { return new Set(); }
    if (!rx) return new Set(inv.hosts.has(t) ? [t] : []);
    const out = new Set(every.filter(h => rx.test(h)));
    if (t[0] !== '~') names.forEach(g => { if (rx.test(g)) hostsOf(inv, g).forEach(h => out.add(h)); });
    return out;
  };
  const terms = limitTerms(limit);
  const unknown = terms.map(t => t.replace(/^[!&]/, '')).filter(t => t && !match(t).size);
  const plain = terms.filter(t => !'!&'.includes(t[0]));
  let sel = plain.length ? new Set(plain.flatMap(t => [...match(t)])) : new Set(every);
  terms.forEach(t => {
    if (t[0] === '&') { const m = match(t.slice(1)); sel = new Set([...sel].filter(h => m.has(h))); }
    if (t[0] === '!') match(t.slice(1)).forEach(h => sel.delete(h));
  });
  return { hosts: every.filter(h => sel.has(h)), unknown };
}

const iniVal = v => typeof v === 'string' ? (v && !/[\s"'#=]/.test(v) ? v : JSON.stringify(v)) : JSON.stringify(v);

// model: { hosts: [[name, vars]], groups: { name: { hosts: [[name, vars]], children: [], vars: {} } } }
function iniFromModel(model, note) {
  const done = new Set();
  const line = (h, v) => {
    const vars = done.has(h) ? [] : Object.entries(v || {}).filter(([, x]) => x !== '' && x != null);
    done.add(h);
    return [h, ...vars.map(([k, x]) => `${k}=${iniVal(x)}`)].join(' ');
  };
  const kv = vars => Object.entries(vars).map(([k, x]) => `${k}=${iniVal(x)}`);
  const out = [`# ${note}`, ...model.hosts.map(([h, v]) => line(h, v))];
  Object.entries(model.groups).forEach(([g, s]) => {
    if (g === 'all') return;
    if (s.hosts.length || !(s.children.length || Object.keys(s.vars).length)) out.push('', `[${g}]`, ...s.hosts.map(([h, v]) => line(h, v)));
    if (s.children.length) out.push('', `[${g}:children]`, ...s.children);
    if (Object.keys(s.vars).length) out.push('', `[${g}:vars]`, ...kv(s.vars));
  });
  if (model.groups.all && Object.keys(model.groups.all.vars).length) out.push('', '[all:vars]', ...kv(model.groups.all.vars));
  return out.join('\n') + '\n';
}

const HOST_KEY = /^(host|hostname|host_name|name|fqdn|server|inventory_hostname)$/i;
const ADDR_KEY = /^(ip|ip_address|ipaddress|address|ansible_host)$/i;
const GROUP_KEY = /^(groups?|ansible_groups?)$/i;

// A list of hosts: strings, or records with a name, optional groups and anything else as host variables.
function recordsModel(records) {
  const model = { hosts: [], groups: {} };
  records.forEach(r => {
    if (typeof r === 'string') { if (r.trim()) model.hosts.push([r.trim(), {}]); return; }
    if (!r || typeof r !== 'object') return;
    const keys = Object.keys(r);
    const nameKey = keys.find(k => HOST_KEY.test(k) && r[k]) || keys.find(k => ADDR_KEY.test(k) && r[k]);
    if (!nameKey) return;
    const name = String(r[nameKey]).trim(), vars = {};
    let groups = [];
    keys.forEach(k => {
      const v = r[k];
      if (k === nameKey || v === '' || v == null) return;
      if (GROUP_KEY.test(k)) groups = Array.isArray(v) ? v.map(String) : String(v).split(/[;|,\s]+/).filter(Boolean);
      else if (ADDR_KEY.test(k)) { if (String(v) !== name) vars.ansible_host = String(v); }
      else if (HOST_KEY.test(k)) return;
      else if (k === 'vars' && typeof v === 'object') Object.assign(vars, v);
      else vars[k] = v;
    });
    if (!groups.length) model.hosts.push([name, vars]);
    groups.forEach(g => (model.groups[g] ||= { hosts: [], children: [], vars: {} }).hosts.push([name, vars]));
  });
  return model;
}

// ansible-inventory --list output, or the YAML inventory layout written as JSON.
function groupsModel(data) {
  const model = { hosts: [], groups: {} };
  const hostvars = data._meta?.hostvars || {};
  const grp = g => model.groups[g] ||= { hosts: [], children: [], vars: {} };
  const walk = (name, g) => {
    if (!g || typeof g !== 'object') return;
    const s = grp(name);
    const hs = Array.isArray(g) ? g : g.hosts || [];
    (Array.isArray(hs) ? hs.map(h => [h, hostvars[h] || {}]) : Object.entries(hs).map(([h, v]) => [h, v || hostvars[h] || {}]))
      .forEach(([h, v]) => s.hosts.push([String(h), v]));
    Object.assign(s.vars, g.vars || {});
    const ch = g.children || [];
    if (Array.isArray(ch)) ch.forEach(c => { if (!s.children.includes(c)) s.children.push(c); });
    else Object.entries(ch).forEach(([c, cg]) => { if (!s.children.includes(c)) s.children.push(c); walk(c, cg); });
  };
  Object.entries(data).forEach(([g, v]) => { if (g !== '_meta') walk(g, v); });
  ['all', 'ungrouped'].forEach(g => { if (model.groups[g]) { model.hosts.push(...model.groups[g].hosts); model.groups[g].hosts = []; } });
  if (model.groups.ungrouped) delete model.groups.ungrouped;
  if (model.groups.all) model.groups.all.children = [];
  return model;
}

function csvRows(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean) && !r[0].startsWith('#'));
}

function csvModel(text) {
  const rows = csvRows(text);
  const head = rows[0] || [];
  if (head.some(h => HOST_KEY.test(h) || ADDR_KEY.test(h) || GROUP_KEY.test(h)))
    return recordsModel(rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h.toLowerCase(), r[i] ?? '']))));
  return recordsModel(rows.map(r => ({ host: r[0], groups: r[1] || '' })));
}

// Plain host lists ("web01 web02", "web01, web02") become one host per line; INI lines are kept.
function hostListIni(text) {
  return text.split('\n').flatMap(line => {
    const t = line.trim();
    return !t || /^[#;[]/.test(t) || t.includes('=') ? [line] : t.split(/[\s,;]+/).filter(Boolean);
  }).join('\n').replace(/\n*$/, '\n');
}

async function inventoryFromUpload(filename, raw) {
  const text = raw.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  const ext = (filename.match(/\.([^./]+)$/)?.[1] || '').toLowerCase();
  const note = `Converted from ${filename} by Automation Hub`;
  let content, format;
  if (ext === 'json' || /^\s*[{[]\s*["{[\]]/.test(text)) {
    let data = null;
    try { data = JSON.parse(text); } catch (e) { if (ext === 'json') throw new Error('Not valid JSON: ' + e.message); }
    if (data !== null) {
      content = iniFromModel(Array.isArray(data) ? recordsModel(data) : groupsModel(data), note);
      format = 'JSON';
    }
  }
  if (!content && (ext === 'yml' || ext === 'yaml' || (/^[\w.-]+:\s*$/m.test(text) && /^\s+(hosts|children|vars):/m.test(text) && !/^\s*\[/m.test(text)))) {
    if (!API.on) throw new Error('YAML inventories are converted by the hub server. Start ./runner.sh, or upload INI, CSV, JSON or a plain host list');
    content = (await api('POST', '/api/inventories/convert', { content: text })).content;
    format = 'YAML';
  }
  if (!content && (ext === 'csv' || (csvRows(text.split('\n')[0] || '')[0] || []).some(h => HOST_KEY.test(h) || ADDR_KEY.test(h)) && text.split('\n')[0].includes(','))) {
    content = iniFromModel(csvModel(text), note);
    format = 'CSV';
  }
  if (!content) { content = hostListIni(text); format = 'INI'; }
  const hosts = parseInventory(content).hosts.size;
  if (!hosts) throw new Error(`No hosts found in ${filename}`);
  return { content, format, hosts };
}

async function inventoryFromFile(file) {
  if (file.size > 512 * 1024) throw new Error(`${file.name} is larger than 512 KB`);
  const { content, format, hosts } = await inventoryFromUpload(file.name, await file.text());
  return { id: uid('i-'), name: file.name.replace(/\.[^.]+$/, '') || 'Uploaded inventory', description: `Uploaded from ${file.name} (${format}, ${plural(hosts, 'host')})`, content, updated: now() };
}

// Steps that run against hosts: playbooks always, scripts when they take a hub inventory.
function hostable(n) { const a = autoById(n.automationId); return !!a && (a.type === 'ansible' || (isScript(a) && !!n.inventoryId)); }

// Hosts a script step receives in HOSTS: the inventory's ansible_host when set, else the host name.
function scriptHosts(n, limit = n.limit) {
  const inv = invById(n.inventoryId);
  if (!inv) return '';
  const p = parseInventory(inv.content);
  return resolveLimit(p, limit).hosts.map(h => p.hosts.get(h).vars.ansible_host || h).join(',');
}

// The inventory file a playbook step runs with. Playbooks target their catalog group, so when the
// hub inventory doesn't define that group, every host joins it and the limit picks the hosts.
function nodeInventoryText(n, a) {
  const inv = invById(n.inventoryId);
  if (!inv) return null;
  const g = a.group, p = parseInventory(inv.content);
  if (!g || g === 'all' || hostsOf(p, g).length) return inv.content.replace(/\n*$/, '\n');
  return inv.content.replace(/\n*$/, '\n') + `\n# Added by Automation Hub: the playbook targets [${g}], so every host above joins it.\n[${g}]\n${[...p.hosts.keys()].join('\n')}\n`;
}

function hostsText(wf, n, limit = n.limit) {
  const a = autoById(n.automationId);
  const lim = (limit || '').trim();
  const inv = n.inventoryId && invById(n.inventoryId);
  if (n.inventoryId && !inv) return 'a deleted inventory';
  if (inv) {
    const p = parseInventory(inv.content), r = resolveLimit(p, lim);
    const names = r.hosts.length > 8 ? r.hosts.slice(0, 8).join(', ') + ', …' : r.hosts.join(', ') || 'no hosts';
    return `${names} (${r.hosts.length} of ${p.hosts.size} in ${inv.name})`;
  }
  const src = n.inventoryFrom && wf.nodes.find(x => x.id === n.inventoryFrom);
  if (src) return `IPs from ${nodeName(src)}${lim ? `, limited to ${lim}` : ''}`;
  return `${lim || 'all hosts'} in ${a.dir}/inventory/hosts.ini`;
}

/* =====================================================================
   Commands (shared by run logs and the exported runner script)
   ===================================================================== */
// opts.script: the form used in the exported runner, where hosts come from $HOSTS_<node>.
// opts.hosts: a host limit for this run only (asked at launch).
function nodeCommand(wf, n, opts = {}) {
  const a = autoById(n.automationId);
  if (!a || isApproval(n)) return null;
  const vars = Object.entries({ ...parseVars(a.vars), ...parseVars(n.vars) });
  if (a.type === 'terraform') {
    const act = nodeAction(n);
    const v = vars.map(([k, val]) => shq(`-var=${k}=${val}`)).join(' ');
    const sp = v ? ' ' + v : '';
    const main = act === 'plan' ? `terraform plan -input=false${sp}`
      : act === 'destroy' ? `terraform destroy -auto-approve -input=false${sp}`
      : `terraform apply -auto-approve -input=false${sp} && terraform output -json ip_addresses > "$ART/${n.id}_ips.json"`;
    return `terraform init -input=false && ${main}`;
  }
  if (a.type === 'ansible') {
    let pre = '', inv = '';
    if (n.inventoryFrom && wf.nodes.some(x => x.id === n.inventoryFrom)) {
      pre = `tf_inventory "$ART/${n.inventoryFrom}_ips.json" ${shq(a.group || 'all')} "$ART/${n.id}.ini" && `;
      inv = `-i "$ART/${n.id}.ini" `;
    } else if (n.inventoryId) {
      inv = `-i "$ART/${n.id}.ini" `;  // written by the runner from the hub inventory
    }
    const h = (opts.hosts ?? n.limit ?? '').trim();
    const limit = opts.script ? `\${HOSTS_${n.id}:+--limit "$HOSTS_${n.id}"} ` : h ? `--limit ${shq(h)} ` : '';
    const e = vars.map(([k, val]) => ' -e ' + shq(`${k}=${val}`)).join('');
    return `${pre}ansible-playbook ${inv}${limit}${shq(a.entry)}${e}`;
  }
  if (a.type === 'eda') {
    const env = vars.map(([k, val]) => `${k}=${shq(val)} `).join('');
    const ev = vars.length ? ' --env-vars ' + vars.map(([k]) => k).join(',') : '';
    return `${env}ansible-rulebook -r ${shq(a.entry)} -i inventory/hosts.ini${ev}`;
  }
  // Scripts: variables become environment variables, except args=..., which is passed on the command line.
  const args = vars.filter(([k]) => k === 'args').map(([, v]) => ' ' + v).join('');
  const tf = n.inventoryFrom && wf.nodes.some(x => x.id === n.inventoryFrom) ? `TF_IPS_FILE="$ART/${n.inventoryFrom}_ips.json" ` : '';
  const hosts = !n.inventoryId ? '' : opts.script ? `HOSTS="$HOSTS_${n.id}" ` : `HOSTS=${shq(scriptHosts(n, opts.hosts ?? n.limit))} `;
  const env = vars.filter(([k]) => k !== 'args').map(([k, val]) => `${k}=${shq(val)} `).join('');
  return `${tf}${hosts}${env}${a.type === 'python' ? 'python3' : 'bash'} ${shq(a.entry)}${args}`;
}

function automationCommand(a) {
  return nodeCommand({ nodes: [] }, { id: 'node', automationId: a.id, vars: '', action: a.action });
}

function edgeTest(type, p) {
  return type === 'success' ? `ok ${p}` : type === 'failure' ? `fail ${p}` : `finished ${p}`;
}

function runnerScript(wf) {
  const order = topo(wf).filter(id => id !== 'start');
  const lines = [];
  const L = s => lines.push(s);
  const nodes = order.map(id => wf.nodes.find(n => n.id === id));
  L('#!/usr/bin/env bash');
  L(`# Automation Hub workflow: ${wf.name}`);
  L(`# Generated ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC, ${wf.nodes.length} node(s).`);
  L('#');
  L('# Run from the root of the repository (each node cds into its project folder):');
  L('#   bash workflow.sh');
  L('# Edges keep their meaning from the visualizer: on success / on failure / always.');
  L('# Logs and Terraform outputs are kept in $ART.');
  L('#');
  summaryLines(wf).forEach(L);
  L('set -uo pipefail');
  L('');
  L('ROOT="${ROOT:-$PWD}"');
  L('export ART="${ART:-$ROOT/.hub/runs/$(date +%Y%m%d_%H%M%S)}"');
  L('mkdir -p "$ART"');
  L('');
  L('declare -A S=([start]=ok)   # node status: ok | fail | skip');
  L('ok()       { [[ ${S[$1]:-} == ok ]]; }');
  L('fail()     { [[ ${S[$1]:-} == fail ]]; }');
  L('finished() { ok "$1" || fail "$1"; }');
  L('');
  L('# Write an Ansible inventory from a Terraform ip_addresses output (IPv4 only).');
  L('tf_inventory() {');
  L('  python3 -c \'import json, sys');
  L('ips = [i for i in json.load(open(sys.argv[1])) if ":" not in i and not i.startswith("127.")]');
  L('print("[%s]" % sys.argv[2]); print("\\n".join(ips))\' "$1" "$2" > "$3"');
  L('}');
  L('export -f tf_inventory');
  L('');
  L('step() {');
  L('  local id=$1 name=$2 dir=$3 cmd=$4');
  L('  printf \'\\n==> [%s] %s\\n    $ cd %s && %s\\n\' "$id" "$name" "$dir" "$cmd"');
  L('  if (cd "$ROOT/$dir" && bash -c "$cmd") 2>&1 | tee "$ART/$id.log"; then');
  L('    S[$id]=ok');
  L('  else');
  L('    S[$id]=fail; printf \'!!  [%s] failed, see %s\\n\' "$id" "$ART/$id.log"');
  L('  fi');
  L('}');
  L('skip() { S[$1]=skip; printf \'\\n--  [%s] %s skipped\\n\' "$1" "$2"; }');
  if (wf.nodes.some(isApproval)) {
    L('');
    L('# Approval steps: APPROVE_<step>=yes|no from the environment, else ask on the terminal.');
    L('# Unattended runs with neither are rejected. (The hub\'s approver roles only apply inside the hub.)');
    L('approve() {');
    L('  local id=$1 name=$2 info=$3 var="APPROVE_$1" ans');
    L('  printf \'\\n==> [%s] %s: waiting for approval\\n\' "$id" "$name"');
    L('  [[ -n $info ]] && printf \'    %s\\n\' "$info"');
    L('  if [[ -n ${!var:-} ]]; then ans=${!var}');
    L('  elif [[ -t 0 ]]; then read -r -p "    Approve? [y/N] " ans');
    L('  else ans=no; fi');
    L('  if [[ $ans =~ ^([Yy]|[Yy][Ee][Ss])$ ]]; then S[$id]=ok; echo "    approved"; else S[$id]=fail; echo "    rejected"; fi');
    L('}');
  }
  L('');
  runnerHostLines(wf, nodes).forEach(L);
  const names = nodes.map(n => `[${n.id}]=${shq(nodeName(n))}`).join(' ');
  L(`declare -A NAME=(${names})`);
  nodes.forEach(n => {
    const a = autoById(n.automationId);
    const inc = wf.edges.filter(e => e.to === n.id);
    const name = shq(nodeName(n));
    L('');
    L(`# ${n.id} · ${nodeName(n)}${a ? ` (${TYPES[a.type].label}${a.type === 'terraform' ? ' ' + nodeAction(n) : ''})` : ''}`);
    if (!inc.length) { L(`skip ${n.id} ${name}   # not connected to START`); return; }
    if (!a) { L(`skip ${n.id} ${name}   # automation missing from catalog`); return; }
    const join = n.convergence === 'all' ? ' && ' : ' || ';
    L(`if ${inc.map(e => edgeTest(e.type, e.from)).join(join)}; then`);
    if (isApproval(n)) L(`  approve ${n.id} ${name} ${shq(n.instructions || '')}`);
    else L(`  step ${n.id} ${name} ${shq(a.dir)} ${shq(nodeCommand(wf, n, { script: true }))}`);
    L(`else`);
    L(`  skip ${n.id} ${name}`);
    L(`fi`);
  });
  const unhandled = wf.nodes.filter(n => !wf.edges.some(e => e.from === n.id && e.type !== 'success')).map(n => n.id);
  L('');
  L("printf '\\n== Summary ==\\n'");
  if (order.length) L(`for id in ${order.join(' ')}; do printf '  %-4s %-5s %s\\n' "$id" "\${S[$id]:-skip}" "\${NAME[$id]}"; done`);
  L('');
  L('# The workflow fails if a node failed and nothing handles that failure.');
  L('rc=0');
  if (unhandled.length) L(`for id in ${unhandled.join(' ')}; do fail "$id" && rc=1; done`);
  L('exit $rc');
  return lines.join('\n') + '\n';
}

// Host settings of the exported runner: one HOSTS_<node> variable per step, overridable from the
// environment, and the hub inventories the steps use, written into $ART.
function runnerHostLines(wf, nodes) {
  const lines = [], L = x => lines.push(x);
  const hn = nodes.filter(n => hostable(n));
  if (!hn.length) return lines;
  L('# Hosts for each step. Override them from the environment without editing this file, e.g.');
  L(`#   HOSTS_${hn[0].id}=web01,web02 bash workflow.sh`);
  L('# Playbook steps take an Ansible --limit pattern (empty = every host in the inventory);');
  L('# script steps get the value in HOSTS. Steps marked "asks" prompt when run in a terminal.');
  hn.forEach(n => {
    const a = autoById(n.automationId);
    const def = isScript(a) ? scriptHosts(n) : (n.limit || '').trim();
    const v = `HOSTS_${n.id}`;
    L(`# ${n.id} · ${nodeName(n)}: ${hostsText(wf, n)}${n.promptHosts ? ' (asks)' : ''}`);
    if (n.promptHosts) {
      L(`if [[ -z \${${v}+x} && -t 0 ]]; then`);
      L(`  read -rp ${shq(`Hosts for ${n.id} ${nodeName(n)} [${def || 'all'}]: `)} ${v}`);
      L(`  ${v}=\${${v}:-${shq(def)}}`);
      L('fi');
    }
    L(`export ${v}=\${${v}-${shq(def)}}`);
  });
  hn.filter(n => n.inventoryId && autoById(n.automationId).type === 'ansible').forEach(n => {
    const text = nodeInventoryText(n, autoById(n.automationId));
    L('');
    if (text === null) { L(`# ${n.id}: its hub inventory was deleted, so "$ART/${n.id}.ini" is missing and the step fails.`); return; }
    L(`# Inventory for ${n.id}: hub inventory "${invById(n.inventoryId).name}"`);
    L(`cat > "$ART/${n.id}.ini" <<'HUB_INVENTORY'`);
    text.replace(/\n$/, '').split('\n').forEach(L);
    L('HUB_INVENTORY');
  });
  L('');
  return lines;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function openModal(html, wide) {
  const card = $('#modalCard');
  card.className = 'modal-card' + (wide ? ' wide' : '');
  card.innerHTML = html;
  $('#modal').classList.add('open');
  $('#scrim').classList.add('open');
  return card;
}
function closeModal() {
  $('#modal').classList.remove('open');
  if (!$('#drawer').classList.contains('open')) $('#scrim').classList.remove('open');
}
function openDrawer(html) {
  const d = $('#drawer');
  d.innerHTML = html;
  d.classList.add('open');
  d.setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('open');
  return d;
}
function closeDrawer() {
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  if (!$('#modal').classList.contains('open')) $('#scrim').classList.remove('open');
}

function download(name, text, type = 'text/plain') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
  catch (e) { toast('Copy failed: select the text and copy it manually'); }
}

const VIEWS = { settings: viewSettings, approvals: viewApprovals, users: viewUsers, overview: viewOverview, catalog: viewCatalog, inventories: viewInventories, workflows: viewWorkflows, activity: viewActivity, designer: viewDesigner };

function go(hash) { location.hash = hash; }

function onRoute() {
  let [view, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (!VIEWS[view]) view = 'overview';
  if (D && D.dirty && !(view === 'designer' && arg === D.wf.id)) {
    if (!confirm(`Discard unsaved changes to "${D.wf.name}"?`)) { history.replaceState(null, '', '#/designer/' + D.wf.id); return; }
    D = null;
  }
  if (view !== 'designer') D = null;
  closeDrawer(); closeModal();
  $('#sidebar').classList.remove('open');
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  const main = $('#main');
  main.className = 'main' + (view === 'designer' ? ' designer' : '');
  main.scrollTop = 0;
  VIEWS[view](main, arg);
}
window.addEventListener('hashchange', onRoute);

      ${users.length ? `<p class="muted" style="font-size:calc(13px * var(--fs))">Used by ${users.map(w => `<b>${esc(w.name)}</b>`).join(', ')}.</p>` : ''}
    </form>
    <div class="modal-foot"><button class="btn btn-primary" form="invForm" type="submit">${existing ? 'Save' : 'Add inventory'}</button>
      <button class="btn btn-secondary" id="invUp">Replace from file…</button>
      <button class="btn btn-secondary" id="invDl">Download .ini</button>
      ${existing ? '<button class="btn btn-danger" id="invDel">Delete</button>' : ''}
      <button class="btn btn-plain" data-close>Cancel</button>
      <input type="file" id="invUpFile" accept="${INV_ACCEPT}" hidden></div>`, true);
  const form = card.querySelector('#invForm'), ta = form.elements.content;
  const preview = () => { card.querySelector('#invPreview').innerHTML = inventoryPreviewHtml(ta.value); };
  preview();
  ta.oninput = preview;
  const done = () => {
    closeModal();
    if (location.hash.startsWith('#/inventories')) viewInventories($('#main'));
    if (D && $('#side')) renderSide();
  };
  card.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  card.querySelector('#invUp').onclick = () => card.querySelector('#invUpFile').click();
  card.querySelector('#invUpFile').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const up = await inventoryFromFile(f);
      ta.value = up.content;
      if (!form.elements.name.value.trim()) form.elements.name.value = up.name;
      if (!form.elements.description.value.trim()) form.elements.description.value = up.description;
      preview();
      toast(`Loaded ${f.name}. Save to keep it.`);
    } catch (err) { toast('Upload failed: ' + err.message); }
  };
  card.querySelector('#invDl').onclick = () => download(((form.elements.name.value || 'inventory').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'inventory') + '.ini', ta.value);
  card.querySelector('#invDel')?.addEventListener('click', () => {
    if (!confirm(`Delete inventory "${inv.name}"?${users.length ? ` ${plural(users.length, 'workflow')} use it; their steps will need a new host source.` : ''}`)) return;
    state.inventories = state.inventories.filter(x => x.id !== inv.id);
    persist(); done(); toast('Inventory deleted');
  });
  form.onsubmit = e => {
    e.preventDefault();
    const rec = { ...inv, name: form.elements.name.value.trim(), description: form.elements.description.value.trim(), content: ta.value.replace(/\n*$/, '\n'), updated: now() };
    if (new Blob([rec.content]).size > 512 * 1024) { toast('The inventory is larger than 512 KB'); return; }
    const i = state.inventories.findIndex(x => x.id === rec.id);
    if (i >= 0) state.inventories[i] = rec; else state.inventories.push(rec);
    persist(); done();
    const n = parseInventory(rec.content).hosts.size;
    toast(n ? `Inventory saved (${plural(n, 'host')})` : 'Inventory saved, but it has no hosts yet');
  };
}

/* =====================================================================
   Catalog
   ===================================================================== */
const catalogState = { q: '', type: 'all', dir: 1 };

function viewCatalog(main) {
  crumbs([['Automation Platform', '#/overview'], ['Automation Hub', '#/catalog'], ['Catalog']]);
  main.innerHTML = `
  <div class="page">
    <div class="page-head"><div><h1>Catalog</h1><p>Terraform modules, Ansible playbooks, EDA rulebooks and scripts available to workflows.</p></div>
      <div class="spacer"></div>${API.on && can('catalog') ? '<button class="btn btn-secondary" id="syncAll" title="Import every project\'s files from the repository">Sync all from repo</button>' : ''}${API.on ? '<button class="btn btn-secondary" id="valAll" title="Check the syntax of every stored file">' + ICON.check + ' Validate all</button>' : ''}${can('catalog') ? `<button class="btn btn-primary" id="addAuto">${ICON.plus} Add automation</button>` : ''}</div>
    <div class="toolbar">
      <div class="search"><input class="input" id="catQ" placeholder="Filter by keywords" value="${esc(catalogState.q)}"><button aria-label="Search">${ICON.search}</button></div>
      <button class="icon-btn" id="catSort" title="Sort ${catalogState.dir > 0 ? 'Z–A' : 'A–Z'}">${ICON.sort}</button>
      <div class="chips" id="catTypes">
        ${[['all', 'All'], ...CATALOG_TYPES.map(k => [k, TYPES[k].label])].map(([k, l]) => `<button class="chip ${catalogState.type === k ? 'on' : ''}" data-type="${k}">${l}</button>`).join('')}
      </div>
      <div class="pager" id="catPager"></div>
    </div>
    <div class="grid" id="catGrid"></div>
  </div>`;
  $('#addAuto')?.addEventListener('click', () => automationForm());
  $('#valAll')?.addEventListener('click', async e => {
    const b = e.currentTarget;
    b.disabled = true; b.lastChild.textContent = ' Validating…';
    try {
      const results = Object.values(await validateAutomations());
      const bad = results.filter(r => r.status === 'error').length, warn = results.filter(r => r.status === 'warning').length;
      toast(bad ? `${plural(bad, 'automation')} with errors, ${warn} with warnings` : warn ? `All valid, ${warn} with warnings` : `All ${results.length} automations are valid`);
    } catch (err) { toast('Validation failed: ' + err.message); }
    if ($('#catGrid')) renderCatalogGrid();
    b.disabled = false; b.lastChild.textContent = ' Validate all';
  });
  $('#syncAll')?.addEventListener('click', async () => {
    try {
      await flushSync();
      const { results } = await api('POST', '/api/sync-repo');
      results.forEach(r => { const a = autoById(r.id); if (a && r.files) a.files = r.files; });
      const sum = k => results.reduce((n, r) => n + (r[k] || 0), 0);
      toast(`Repository sync: ${sum('added')} added, ${sum('updated')} updated, ${sum('unchanged')} unchanged`);
      renderCatalogGrid();
    } catch (e) { toast('Sync failed: ' + e.message); }
  });
  $('#catQ').oninput = e => { catalogState.q = e.target.value; renderCatalogGrid(); };
  $('#catSort').onclick = () => { catalogState.dir *= -1; renderCatalogGrid(); };
  $('#catTypes').onclick = e => {
    const b = e.target.closest('[data-type]');
    if (!b) return;
    catalogState.type = b.dataset.type;
    $$('#catTypes .chip').forEach(c => c.classList.toggle('on', c === b));
    renderCatalogGrid();
  };
  renderCatalogGrid();
}

function renderCatalogGrid() {
  const q = catalogState.q.toLowerCase().trim();
  const list = state.automations
    .filter(a => catalogState.type === 'all' || a.type === catalogState.type)
    .filter(a => !q || [a.name, a.dir, a.entry, a.description, ...(a.tags || [])].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name) * catalogState.dir);
  $('#catPager').innerHTML = list.length ? `<b>1 - ${list.length}</b> of <b>${state.automations.length}</b>` : `0 of ${state.automations.length}`;
  const grid = $('#catGrid');
  if (!list.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No automations match this filter.</div>`; return; }
  grid.innerHTML = list.map(a => `
    <div class="card">
      ${typeLogo(a.type)}
      <h3>${esc(a.name)}</h3>
      <div class="ns">${esc(a.dir)}/${esc(a.entry)}</div>
      <div class="desc">${esc(a.description)}</div>
      <div class="tags">${(a.tags || []).slice(0, 4).map(t => `<span class="tag">${esc(t)}</span>`).join('')}${API.on ? `<span class="tag" style="color:var(--text)">${(a.files || []).length} file${(a.files || []).length === 1 ? '' : 's'} stored</span>` : ''}</div>
      ${API.on ? `<div>${validationLabel(a.validation)}</div>` : ''}
      <div class="foot"><button data-view-auto="${a.id}">View details</button><button data-use-auto="${a.id}">Use in workflow</button></div>
    </div>`).join('');
  grid.onclick = e => {
    const v = e.target.closest('[data-view-auto]'), u = e.target.closest('[data-use-auto]');
    if (v) automationDrawer(v.dataset.viewAuto);
    if (u) newWorkflowWith(u.dataset.useAuto);
  };
}

function usedIn(aid) { return state.workflows.filter(w => w.nodes.some(n => n.automationId === aid)); }

function automationDrawer(id, result) {
  const a = autoById(id);
  if (!a) return;
  const used = usedIn(id);
  const d = openDrawer(`
    <div class="drawer-head">${typeLogo(a.type)}<div style="flex:1;min-width:0"><h2>${esc(a.name)}</h2><div style="color:var(--muted);font-size:calc(13px * var(--fs))">${TYPES[a.type].label}</div></div>
      <button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="drawer-body">
      <p style="margin:0">${esc(a.description) || '<span style="color:var(--muted)">No description.</span>'}</p>
      <dl class="props">
        <dt>Project folder</dt><dd class="mono">${esc(a.dir)}</dd>
        <dt>Entry</dt><dd class="mono">${esc(a.entry)}</dd>
        ${a.type === 'ansible' ? `<dt>Target group</dt><dd class="mono">${esc(a.group || '—')}</dd>` : ''}
        ${a.type === 'terraform' ? `<dt>Default action</dt><dd>${esc(a.action || 'apply')}</dd>` : ''}
        <dt>Tags</dt><dd><div class="tags">${(a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('') || '—'}</div></dd>
        <dt>Updated</dt><dd>${fmtTime(a.updated)}</dd>
      </dl>
      <div><h4 style="margin:0 0 6px;font-size:calc(13px * var(--fs))">Default variables</h4><div class="cmd-box mono">${esc(a.vars || '# none')}</div></div>
      <div><h4 style="margin:0 0 6px;font-size:calc(13px * var(--fs))">Command</h4><div class="cmd-box mono">$ cd ${esc(a.dir)} && ${esc(automationCommand(a))}</div></div>
      <div><h4 style="margin:0 0 6px;font-size:calc(13px * var(--fs))">Used in ${used.length} workflow${used.length === 1 ? '' : 's'}</h4>
        ${used.map(w => `<div><a href="#/designer/${w.id}">${esc(w.name)}</a></div>`).join('') || '<span style="color:var(--muted)">Not used yet.</span>'}</div>
      ${API.on ? `<div id="valBox">${validationSection(a, result)}</div>` : ''}
      ${filesSection(a)}
    </div>
    <div class="drawer-foot">
      <button class="btn btn-primary" data-use>Use in new workflow</button>
      ${can('catalog') ? `<button class="btn btn-secondary" data-edit>Edit</button>
      <button class="btn btn-danger" data-del style="margin-left:auto">Delete</button>` : ''}
    </div>`);
  d.querySelector('[data-close]').onclick = closeDrawer;
  bindFilesSection(d, a);
  bindValidation(d, a, result);
  d.querySelector('[data-use]').onclick = () => { closeDrawer(); newWorkflowWith(id); };
  d.querySelector('[data-edit]')?.addEventListener('click', () => { closeDrawer(); automationForm(id); });
  d.querySelector('[data-del]')?.addEventListener('click', () => {
    if (used.length) { toast(`Remove it from ${used.length} workflow(s) first`); return; }
    if (!confirm(`Delete "${a.name}" from the catalog?${API.on && (a.files || []).length ? ` Its ${a.files.length} stored file(s) are deleted from the database too.` : ""}`)) return;
    state.automations = state.automations.filter(x => x.id !== id);
    persist(); closeDrawer(); renderCatalogGrid(); toast('Automation deleted');
  });
}

function automationForm(id) {
  const a = id ? autoById(id) : { name: '', type: 'ansible', dir: '', entry: '', description: '', tags: [], vars: '', group: '', action: 'apply' };
  const card = openModal(`
    <div class="modal-head"><h2>${id ? 'Edit automation' : 'Add automation'}</h2><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>

      action: f.type === 'terraform' ? f.action : '', tags: f.tags.split(',').map(t => t.trim()).filter(Boolean), updated: now(),
    };
    const dirChanged = !id || a.dir !== rec.dir;

    persist(); closeModal();

/* ---------- validation (database mode) ---------- */
function validationLabel(v) {
  if (!v) return '<span class="label skipped">Not validated</span>';
  const c = v.counts || {};
  const txt = v.status === 'error' ? `${plural(c.error || 1, 'file')} with errors` : v.status === 'warning' ? 'Valid, with warnings' : 'Valid';
  const cls = v.status === 'error' ? 'failed' : v.status === 'warning' ? 'warning' : 'success';
  return `<span class="label ${cls}">${txt}</span>${v.stale ? ' <span class="label skipped" title="Files changed after the last check">changed since check</span>' : ''}`;
}

function validationSection(a, result) {
  const v = a.validation;
  return `<div class="files-head"><h4>Validation</h4><button class="btn btn-secondary btn-sm" data-validate>${ICON.check} Validate</button></div>
    <div>${validationLabel(v)} ${v ? `<span class="muted" style="font-size:calc(12px * var(--fs))">checked ${fmtTime(v.checked)}</span>` : ''}</div>
    <div data-auto="${a.id}" id="valDetails">${result ? validationDetails(result, 12) : v ? '<span class="muted">Loading the last result…</span>' : '<span class="muted" style="font-size:calc(13px * var(--fs))">Checks the syntax of every stored file and runs the entry point through its tool (ansible-playbook --syntax-check, terraform validate, bash -n, Python compile).</span>'}</div>`;
}

function bindValidation(d, a, result) {
  if (!API.on) return;
  const details = d.querySelector('#valDetails');
  if (!result && a.validation) {
    api('GET', `/api/automations/${a.id}/validation`).then(r => {
      if (!d.contains(details)) return;
      details.innerHTML = r.status ? validationDetails(r, 12) : '';
      bindPanelLinks(details.parentElement);
    }).catch(() => { details.innerHTML = ''; });
  }
  bindPanelLinks(details.parentElement);
  d.querySelector('[data-validate]').onclick = async e => {
    e.currentTarget.disabled = true;
    e.currentTarget.lastChild.textContent = ' Validating…';
    try {
      const r = (await validateAutomations([a.id]))[a.id];
      toast(r.status === 'error' ? 'Validation found errors' : r.status === 'warning' ? 'Valid, with warnings' : 'Valid');
      automationDrawer(a.id, r);
      if ($('#catGrid')) renderCatalogGrid();
    } catch (err) { toast('Validation failed: ' + err.message); automationDrawer(a.id); }
  };
}

async function validateAutomations(ids) {
  await flushSync();
  const { results } = await api('POST', '/api/validate', ids ? { ids } : {});
  Object.values(results).forEach(r => {
    const a = autoById(r.automation_id);
    if (a) a.validation = { status: r.status, checked: r.checked, stale: false, counts: r.counts };
  });
  return results;
}

/* ---------- stored files (database mode) ---------- */
const fmtSize = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
const FOLDER_SKIP = /(^|\/)(\.git|\.terraform|node_modules|__pycache__)\/|(^|\/)(terraform\.tfvars|[^/]*\.auto\.tfvars|[^/]*\.tfstate(\.[^/]*)?|\.env)$/;

function filesSection(a) {
  if (!API.on) return `<div><h4 style="margin:0 0 6px;font-size:calc(13px * var(--fs))">Files</h4><span style="color:var(--muted);font-size:calc(13px * var(--fs))">Start the hub with <code>./runner.sh</code> to store this automation's playbooks and files in the database.</span></div>`;
  const files = a.files || [];
  return `<div>
    <div class="files-head"><h4>Files (${files.length})</h4>
      ${can('catalog') ? `<button class="btn btn-secondary btn-sm" data-f-new>New</button>
      <button class="btn btn-secondary btn-sm" data-f-up>Upload</button>
      <button class="btn btn-secondary btn-sm" data-f-folder>Folder</button>
      <button class="btn btn-secondary btn-sm" data-f-repo title="Import from ${esc(a.dir)}/ in the repository">Sync repo</button>` : '<span class="muted" style="font-size:calc(12px * var(--fs))">read-only</span>'}
      ${files.length ? `<button class="btn btn-plain btn-sm" data-f-zip>.zip</button>` : ''}</div>
    ${files.length ? `<div class="file-list">${files.map(f => `<button class="file-row" data-fid="${f.id}"><span class="p">${esc(f.path)}</span><span class="s">${fmtSize(f.size)}</span><span class="s" style="grid-column:1/-1">updated ${fmtTime(f.updated)}</span></button>`).join('')}</div>`
      : `<div class="empty" style="padding:20px">No files stored yet. Upload them, or sync from <code>${esc(a.dir)}/</code>.</div>`}
    <input type="file" data-f-input multiple hidden><input type="file" data-f-dir webkitdirectory multiple hidden>
  </div>`;
}

function bindFilesSection(d, a) {
  if (!API.on) return;
  const q = s => d.querySelector(s);
  if (q('[data-f-new]')) {
  q('[data-f-new]').onclick = () => fileEditor(a.id, null);
  q('[data-f-up]').onclick = () => q('[data-f-input]').click();
  q('[data-f-folder]').onclick = () => q('[data-f-dir]').click();
  q('[data-f-repo]').onclick = () => syncRepo(a.id);
  }
  q('[data-f-zip]')?.addEventListener('click', async () => {
    try { const blob = await api('GET', `/api/automations/${a.id}/zip`); download((a.dir.split('/').pop() || a.id) + '.zip', blob, 'application/zip'); }
    catch (e) { toast('Download failed: ' + e.message); }
  });
  q('[data-f-input]').onchange = e => uploadFiles(a.id, [...e.target.files], false);
  q('[data-f-dir]').onchange = e => uploadFiles(a.id, [...e.target.files], true);
  d.querySelectorAll('[data-fid]').forEach(b => b.onclick = () => fileEditor(a.id, +b.dataset.fid));
}

function setFiles(aid, files) {
  const a = autoById(aid);
  if (a) { a.files = files; if (a.validation) a.validation.stale = true; }
  if ($('#drawer').classList.contains('open') && !$('#modal').classList.contains('open')) automationDrawer(aid);
  if ($('#catGrid')) renderCatalogGrid();
}

async function syncRepo(aid, quiet) {
  try {
    await flushSync();
    const r = await api('POST', `/api/automations/${aid}/sync-repo`);
    if (r.error) { if (!quiet) toast(r.error); return; }
    setFiles(aid, r.files);
    toast(`Repository sync: ${r.added} added, ${r.updated} updated, ${r.unchanged} unchanged` + (r.skipped.length ? `, ${r.skipped.length} skipped` : ''));
  } catch (e) { toast('Sync failed: ' + e.message); }
}

async function uploadFiles(aid, list, folder) {
  await flushSync();
  let stored = 0;
  const skipped = [];
  for (const f of list) {
    const path = folder && f.webkitRelativePath ? f.webkitRelativePath.split('/').slice(1).join('/') : f.name;
    if (folder && FOLDER_SKIP.test(path)) continue;
    if (f.size > 512 * 1024) { skipped.push(path); continue; }
    const text = await f.text();
    if (text.includes('\u0000')) { skipped.push(path); continue; }
    try { await api('PUT', `/api/automations/${aid}/files`, { path, content: text, source: 'upload' }); stored++; }
    catch (e) { skipped.push(path); }
  }
  setFiles(aid, await api('GET', `/api/automations/${aid}/files`));
  toast(`Stored ${stored} file${stored === 1 ? '' : 's'}` + (skipped.length ? `, skipped ${skipped.length} (binary or over 512 KB)` : ''));
}

async function fileEditor(aid, fid, line) {
  const a = autoById(aid);
  let file;
  try { file = fid ? await api('GET', `/api/files/${fid}`) : { path: '', content: '' }; }
  catch (e) { toast(e.message); return; }
  let viewing = null; // version id being previewed
  const card = openModal(`
    <div class="modal-head"><h2>${fid ? 'Edit file' : 'New file'}</h2><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="modal-body">
      <label class="field" style="margin-bottom:10px">Path <span class="hint">Relative to ${esc(a.dir)}/</span><input class="input mono" id="fePath" placeholder="tasks/new_task.yml"></label>
      <div class="fe-grid" id="feGrid"><textarea class="code" id="feCode" spellcheck="false"></textarea><div class="fe-hist" id="feHist" hidden></div></div>
      <div id="feIssues"></div>
      <p id="feNote" style="margin:8px 0 0;color:var(--muted);font-size:calc(13px * var(--fs))">${fid ? `${fmtSize(file.size)} · updated ${fmtTime(file.updated)}` : 'Saved to the database; every save keeps a version.'}</p>
    </div>
    <div class="modal-foot">${can('catalog') ? '<button class="btn btn-primary" id="feSave">Save</button>' : '<span class="muted" style="align-self:center">Read-only: only admins change stored files.</span>'}<button class="btn btn-secondary" id="feCheck">${ICON.check} Check syntax</button>
      ${fid ? `<button class="btn btn-secondary" id="feHistBtn">History</button><button class="btn btn-secondary" id="feDl">Download</button>${can('catalog') ? '<button class="btn btn-danger" id="feDel" style="margin-left:auto">Delete</button>' : ''}` : ''}
      <button class="btn btn-plain" data-close>Close</button></div>`, true);
  const code = card.querySelector('#feCode'), pathIn = card.querySelector('#fePath'), note = card.querySelector('#feNote');
  code.value = file.content; pathIn.value = file.path; code.readOnly = pathIn.readOnly = !can('catalog');
  (fid ? code : pathIn).focus();
  const goLine = ln => {
    const lines = code.value.split('\n');
    const start = lines.slice(0, ln - 1).reduce((n, l) => n + l.length + 1, 0);
    code.focus();
    code.setSelectionRange(start, start + (lines[ln - 1] || '').length);
    code.scrollTop = Math.max(0, (ln - 4) * parseFloat(getComputedStyle(code).lineHeight || '18'));
  };
  if (line) requestAnimationFrame(() => goLine(line));
  card.querySelector('#feCheck').onclick = async () => {
    const box = card.querySelector('#feIssues');
    box.innerHTML = '<p class="muted">Checking…</p>';
    try {
      const r = await api('POST', '/api/check-file', { automationId: aid, path: pathIn.value || 'untitled', content: code.value });
      box.innerHTML = r.status === 'skipped' && !r.messages.length ? '<p class="muted">There is no syntax checker for this file type.</p>'
        : `<ul class="issues">${r.messages.length ? r.messages.map(m => `<li class="${m.level}" ${m.line ? `data-ln="${m.line}"` : ''}>${m.line ? `<code>line ${m.line}</code> ` : ''}${esc(m.text)}</li>`).join('')
          : `<li class="ok">No syntax errors (${esc(r.tool)})</li>`}</ul>`;
      box.querySelectorAll('[data-ln]').forEach(li => li.onclick = () => goLine(+li.dataset.ln));
    } catch (e) { box.innerHTML = `<ul class="issues"><li class="error">${esc(e.message)}</li></ul>`; }
  };
  const done = () => { closeModal(); automationDrawer(aid); };
  card.querySelectorAll('[data-close]').forEach(b => b.onclick = done);
  code.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); code.setRangeText('  ', code.selectionStart, code.selectionEnd, 'end'); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); card.querySelector('#feSave')?.click(); }
  });
  if (card.querySelector('#feSave')) card.querySelector('#feSave').onclick = async () => {
    const body = { path: pathIn.value, content: code.value, source: viewing ? 'restore' : 'edit' };
    try {
      const r = fid ? await api('PUT', `/api/files/${fid}`, body) : await api('PUT', `/api/automations/${aid}/files`, body);
      setFiles(aid, r.files);
      toast(r.status === 'unchanged' ? 'No changes to save' : viewing ? 'Version restored' : 'File saved');
      done();
    } catch (e) { toast('Save failed: ' + e.message); }
  };
  if (!fid) return;
  card.querySelector('#feDl').onclick = () => download(file.path.split('/').pop(), code.value);
  if (card.querySelector('#feDel')) card.querySelector('#feDel').onclick = async () => {
    if (!confirm(`Delete ${file.path} and its history from the database? The file in the repository is not touched.`)) return;
    try { const r = await api('DELETE', `/api/files/${fid}`); setFiles(aid, r.files); toast('File deleted'); done(); }
    catch (e) { toast('Delete failed: ' + e.message); }
  };
  card.querySelector('#feHistBtn').onclick = async () => {
    const hist = card.querySelector('#feHist');
    if (!hist.hidden) { hist.hidden = true; card.querySelector('#feGrid').classList.remove('hist'); return; }
    const versions = await api('GET', `/api/files/${fid}/versions`);
    hist.innerHTML = versions.map((v, i) => `<button data-vid="${v.id}" class="${i === 0 ? 'on' : ''}">${i === 0 ? 'Current' : 'Version ' + (versions.length - i)} · ${esc(v.source)}<small>${fmtTime(v.created)} · ${fmtSize(v.size)}</small></button>`).join('');
    hist.hidden = false;
    card.querySelector('#feGrid').classList.add('hist');
    hist.onclick = async e => {
      const b = e.target.closest('[data-vid]');
      if (!b) return;
      hist.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      const isCurrent = b === hist.firstElementChild;
      const v = isCurrent ? { content: file.content } : await api('GET', `/api/versions/${b.dataset.vid}`);
      code.value = v.content;
      viewing = isCurrent ? null : +b.dataset.vid;
      note.textContent = viewing ? `Showing a version from ${fmtTime(v.created)}. Save to restore it as the current content.` : `${fmtSize(file.size)} · updated ${fmtTime(file.updated)}`;
    };
  };
}
