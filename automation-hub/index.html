function viewWorkflows(main) {
  crumbs([['Automation Platform', '#/overview'], ['Workflows', '#/workflows'], ['Templates']]);
  const lastRun = id => state.runs.find(r => r.workflowId === id);
  main.innerHTML = `
  <div class="page">
    <div class="page-head"><div><h1>Workflow templates</h1><p>Chains of automations with success, failure and always paths.</p></div>
      <div class="spacer"></div>
      <button class="btn btn-secondary" id="importWf">Import JSON</button>
      <button class="btn btn-primary" onclick="go('#/designer/new')">${ICON.plus} Create workflow</button>
      <input type="file" id="wfFile" accept="application/json,.json" hidden></div>
    ${state.workflows.length ? `<div class="grid">${state.workflows.map(w => {
      const types = [...new Set(w.nodes.map(n => autoById(n.automationId)?.type).filter(Boolean))];
      const r = lastRun(w.id);
      return `<div class="card">
        <div style="display:flex;gap:6px">${types.map(t => typeLogo(t, 34)).join('') || typeLogo('shell', 34)}</div>
        <h3>${esc(w.name)}</h3>
        <div class="ns">${w.nodes.length} node${w.nodes.length === 1 ? '' : 's'} · ${w.edges.length} link${w.edges.length === 1 ? '' : 's'}</div>
        <div class="desc">${esc(w.description || '')}</div>
        <div style="font-size:calc(12.5px * var(--fs));color:var(--muted)">${r ? `Last run ${statusLabel(r.status)} ${fmtTime(r.started)}` : 'Never run'}</div>
        <div class="foot"><button data-open="${w.id}">Open visualizer</button><button data-dup="${w.id}">Duplicate</button>${ownsWorkflow(w) ? `<button data-del="${w.id}" style="color:var(--danger)">Delete</button>` : ''}</div>
      </div>`;
    }).join('')}</div>` : `<div class="empty">No workflows yet. <a href="#/designer/new">Create one</a>.</div>`}
  </div>`;
  $('#importWf').onclick = () => $('#wfFile').click();
  $('#wfFile').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const w = JSON.parse(await file.text());
      if (!Array.isArray(w.nodes) || !Array.isArray(w.edges)) throw new Error('not a workflow');
      (w.automations || []).forEach(a => { if (!autoById(a.id)) state.automations.push(a); });
      (w.inventories || []).forEach(i => { if (!invById(i.id) && typeof i.content === 'string') state.inventories.push(i); });
      delete w.automations; delete w.inventories;
      w.id = uid('w-'); w.name = w.name || 'Imported workflow'; w.updated = now();
      state.workflows.push(w); persist();
      toast(w.nodes.some(n => !autoById(n.automationId)) ? 'Imported, but some automations are missing from the catalog' : 'Workflow imported');
      viewWorkflows(main);
    } catch (err) { toast('That file is not a workflow export'); }
  };
  main.querySelector('.grid')?.addEventListener('click', e => {
    const o = e.target.closest('[data-open]'), du = e.target.closest('[data-dup]'), de = e.target.closest('[data-del]');
    if (o) go('#/designer/' + o.dataset.open);
    if (du) {
      const c = clone(wfById(du.dataset.dup));
      c.id = uid('w-'); c.name += ' (copy)'; c.updated = now();
      state.workflows.push(c); persist(); viewWorkflows(main); toast('Workflow duplicated');
    }
    if (de) {
      const w = wfById(de.dataset.del);
      if (!confirm(`Delete workflow "${w.name}"?`)) return;
      state.workflows = state.workflows.filter(x => x.id !== w.id); persist(); viewWorkflows(main);
    }
  });
}

function newWorkflowWith(aid) {
  const a = autoById(aid);
  const wf = blankWorkflow();
  wf.name = a.name.split('·').pop().trim() + ' workflow';
  wf.nodes.push(newNode(wf, aid, START_W + 70, -NODE_H / 2));
  wf.edges.push({ id: uid('e'), from: 'start', to: wf.nodes[0].id, type: 'always' });
  startDesigner(wf, true);
}

const DISPLAY_KEY = KEY + '.display';
const THEMES = [
  { id: 'system', name: 'System', desc: 'Light or dark, following your device', sw: ['#f0f0f0', '#151515', '#0066cc', '#1b1d21'] },
  { id: 'light', name: 'Light', desc: 'The default light look', sw: ['#f0f0f0', '#ffffff', '#0066cc', '#151515'] },

  { id: 'pipboy', name: 'Pip-Boy', desc: 'Phosphor-green terminal', sw: ['#021108', '#04190c', '#3cff8f', '#1f9e57'], pip: true },
  { id: 'pipboy-pink', name: 'Pink Pip-Boy', desc: 'The terminal, in hot pink', sw: ['#140310', '#1e0618', '#ff79d2', '#c858a6'], pip: true },
  { id: 'pipboy-bw', name: 'Pip-Boy black & white', desc: 'Monochrome terminal; failure paths are dashed', sw: ['#050505', '#0d0d0d', '#e8e8e8', '#8f8f8f'], pip: true },
  { id: 'super', name: 'Super Systems', desc: 'The logo: CRT black, cream and rainbow stripes', sw: ['#070504', '#110d0a', '#fcf704', '#f9f3c8'], pip: true, cls: 'super' },
];
const FONT_STEPS = [[0.85, 'Smaller'], [0.92, 'Small'], [1, 'Default'], [1.12, 'Large'], [1.25, 'Larger'], [1.4, 'Largest']];
const DISPLAY_DEFAULT = { theme: 'system', fontScale: 1, crt: true };
let DISPLAY = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(DISPLAY_KEY) || 'null');
    if (saved) return { ...DISPLAY_DEFAULT, ...saved };
    const old = localStorage.getItem(KEY + '.theme');  // the earlier light/dark toggle
    return { ...DISPLAY_DEFAULT, theme: old === 'light' || old === 'dark' ? old : 'system' };
  } catch (e) { return { ...DISPLAY_DEFAULT }; }
})();

// Themes that offer the CRT screen effect.
const crtTheme = id => /^(pipboy|super)/.test(id);

function effectiveTheme() {
  if (DISPLAY.theme !== 'system') return DISPLAY.theme;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyDisplay(d) {
  const r = document.documentElement;
  if (d.theme === 'system') delete r.dataset.theme; else r.dataset.theme = d.theme;
  r.style.setProperty('--fs', d.fontScale);
  const pip = d.theme.startsWith('pipboy');
  r.dataset.crt = crtTheme(d.theme) && d.crt ? 'on' : 'off';
  // The terminal typeface comes from Google Fonts when online; offline the system monospace is used.
  if (pip && !document.getElementById('pipFont')) {
    const l = Object.assign(document.createElement('link'), { id: 'pipFont', rel: 'stylesheet', href: 'https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap' });
    document.head.appendChild(l);
  }
  if (d.theme === 'super' && !document.getElementById('superFont')) {
    const l = Object.assign(document.createElement('link'), { id: 'superFont', rel: 'stylesheet', href: 'https://fonts.googleapis.com/css2?family=Audiowide&display=swap' });
    document.head.appendChild(l);
  }
}

function setDisplay(patch) {
  DISPLAY = { ...DISPLAY, ...patch };
  applyDisplay(DISPLAY);
  try { localStorage.setItem(DISPLAY_KEY, JSON.stringify(DISPLAY)); localStorage.removeItem(KEY + '.theme'); } catch (e) { /* not saved */ }
  if (D && $('#canvas')) { draw(); }
}

let approvalsTab = 'pending';
function viewApprovals(main) {
  crumbs([['Automation Platform', '#/overview'], ['Approvals']]);
  if (!API.on) {
    main.innerHTML = `<div class="page"><div class="page-head"><div><h1>Approvals</h1></div></div>
      <div class="empty">Approvals need the hub server. Start <code>./runner.sh</code>; opened as a file, the launcher approves steps directly.</div></div>`;
    return;
  }
  main.innerHTML = `
  <div class="page">
    <div class="page-head"><div><h1>Approvals</h1><p>${can('approve') ? 'Runs paused at an approval step. Approving continues the run on its success path; rejecting takes the failure path.' : 'Approval steps waiting for an approver. Your role can see them but not decide them.'}</p></div></div>
    <div class="tabs" id="apTabs"><button data-t="pending" class="${approvalsTab === 'pending' ? 'on' : ''}">Pending</button><button data-t="history" class="${approvalsTab === 'history' ? 'on' : ''}">History</button></div>
    <div id="apBody"><p class="muted">Loading…</p></div>
  </div>`;
  $('#apTabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { approvalsTab = b.dataset.t; viewApprovals(main); } };
  loadApprovals();
}

async function loadApprovals() {
  try {
    if (approvalsTab === 'history') APPROVALS.history = await api('GET', '/api/approvals?status=all');
    else APPROVALS.pending = await api('GET', '/api/approvals?status=pending');
  } catch (e) { const b = $('#apBody'); if (b) b.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  renderApprovalsBody();
}

function renderApprovalsBody() {
  const body = $('#apBody');
  if (!body) return;
  if (approvalsTab === 'history') {
    const list = APPROVALS.history;
    body.innerHTML = list.length ? `<div class="tbl-wrap"><table class="list"><tr><th>Decision</th><th>Step</th><th>Workflow</th><th>Requested by</th><th>Decided by</th><th>When</th></tr>
      ${list.map(a => `<tr><td>${statusLabel(a.status)}</td><td>${esc(a.step_name)}${a.comment ? `<div class="muted" style="font-size:calc(12.5px * var(--fs))">“${esc(a.comment)}”</div>` : ''}</td>
        <td>${a.workflow_id ? `<a href="#/designer/${esc(a.workflow_id)}">${esc(a.workflow_name)}</a>` : esc(a.workflow_name)}</td><td>${esc(a.requested_by_name)}</td>
        <td>${esc(a.decided_by_name || '—')}</td><td>${fmtTime(a.decided_at || a.created)}</td></tr>`).join('')}</table></div>`
      : '<div class="empty">No approvals yet.</div>';
    return;
  }
  const list = APPROVALS.pending;
  if (!list.length) { body.innerHTML = '<div class="empty">Nothing is waiting for approval.</div>'; return; }
  // Keep half-typed comments when the list refreshes.
  const drafts = Object.fromEntries($$('#apBody textarea[data-c]').map(t => [t.dataset.c, t.value]));
  body.innerHTML = `<div class="ap-list">${list.map(a => {
    const own = a.requested_by === ME.id && ME.role !== 'admin';
    const canDecide = can('approve') && !own;
    const waited = fmtDur(Date.now() - new Date(a.created));
    return `<div class="ap-card">
      <div class="ap-head">${typeLogo('approval', 34)}<div style="min-width:0"><b>${esc(a.step_name)}</b>
        <div class="muted" style="font-size:calc(13px * var(--fs))">${a.workflow_id ? `<a href="#/designer/${esc(a.workflow_id)}">${esc(a.workflow_name)}</a>` : esc(a.workflow_name)} · step ${esc(a.node_id)}</div></div>
        <span class="label waiting" style="margin-left:auto">waiting ${waited}</span></div>
      ${a.instructions ? `<div class="ap-instr">${esc(a.instructions)}</div>` : ''}
      <dl class="props"><dt>Launched by</dt><dd>${esc(a.requested_by_name)}</dd>
        <dt>Requested</dt><dd>${fmtTime(a.created)}</dd>
        ${a.timeoutAt ? `<dt>Times out</dt><dd>${fmtTime(a.timeoutAt)}</dd>` : ''}
        <dt>Run</dt><dd>${a.launcherConnected ? '<span style="color:var(--success)">● the launcher\'s page is waiting</span>' : '<span style="color:var(--warn)">● the launcher\'s page is not responding; the run continues only if it comes back</span>'}</dd></dl>
      ${canDecide ? `<textarea class="textarea" data-c="${a.id}" placeholder="Comment (optional, shown in the run log)" style="font-family:inherit;font-size:calc(14px * var(--fs));min-height:54px">${esc(drafts[a.id] || '')}</textarea>
        <div class="ap-actions"><button class="btn btn-primary" data-ap="${a.id}" data-d="approve">${ICON.check} Approve</button><button class="btn btn-danger" data-ap="${a.id}" data-d="reject">Reject</button></div>`
        : `<div class="muted" style="font-size:calc(13px * var(--fs))">${own ? 'You launched this run, so another approver has to decide.' : 'Only approvers and admins can decide.'}${a.requested_by === ME.id ? ` <button class="btn btn-plain btn-sm" data-cancel="${a.id}">Cancel the request</button>` : ''}</div>`}
    </div>`;
  }).join('')}</div>`;
  body.querySelectorAll('[data-ap]').forEach(b => b.onclick = async () => {
    const comment = body.querySelector(`[data-c="${b.dataset.ap}"]`)?.value || '';
    b.disabled = true;
    try {
      const r = await api('POST', `/api/approvals/${b.dataset.ap}/decide`, { decision: b.dataset.d, comment });
      toast(`${r.step_name}: ${r.status}`);
    } catch (e) { toast(e.message); }
    refreshApprovalCount();
  });
  body.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    try { await api('POST', `/api/approvals/${b.dataset.cancel}/cancel`); toast('Request cancelled; the step counts as rejected'); } catch (e) { toast(e.message); }
    refreshApprovalCount();
  });
}

      <td>${esc(u.roleLabel)}</td><td>${u.disabled ? '<span class="label skipped">Disabled</span>' : '<span class="label success">Active</span>'}</td>
      <td>${u.lastLogin ? fmtTime(u.lastLogin) : '<span class="muted">never</span>'}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn btn-plain btn-sm" data-edit-user="${u.id}">Edit</button>${u.id !== ME.id ? `<button class="btn btn-plain btn-sm" data-del-user="${u.id}" style="color:var(--danger)">Delete</button>` : ''}</td></tr>`).join('')}
  </table></div>`;
  $('#userTable').onclick = async e => {
    const ed = e.target.closest('[data-edit-user]'), del = e.target.closest('[data-del-user]');
    if (ed) userForm(users.find(u => u.id === ed.dataset.editUser), main);
    if (del) {
      const u = users.find(x => x.id === del.dataset.delUser);
      if (!confirm(`Delete ${u.name} (${u.username})? Their workflows and run history stay.`)) return;
      try { await api('DELETE', `/api/users/${u.id}`); toast('User deleted'); viewUsers(main); } catch (err) { toast(err.message); }
    }
  };
}

function userForm(u, main) {
  const card = openModal(`
    <div class="modal-head"><h2>${u ? 'Edit ' + esc(u.name) : 'Add user'}</h2><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <form class="modal-body" id="userForm"><div class="form-grid">
      <label class="field">Username<input class="input" name="username" value="${esc(u?.username || '')}" ${u ? 'disabled' : 'required autocomplete="off"'} pattern="[A-Za-z0-9._@-]{2,64}"></label>
      <label class="field">Display name<input class="input" name="name" value="${esc(u?.name || '')}" placeholder="${u ? '' : 'Defaults to the username'}"></label>
      <label class="field">Role<select class="select" name="role">${Object.entries(ROLE_LABEL).map(([k, v]) => `<option value="${k}" ${(u?.role || 'user') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="field">${u ? 'New password' : 'Password'} <span class="hint">${u ? 'Leave empty to keep it; setting one signs them out' : 'At least 8 characters; they can change it later'}</span><input class="input" type="password" name="password" autocomplete="new-password" ${u ? '' : 'required minlength="8"'}></label>
      ${u && u.id !== ME.id ? `<label class="check-row full"><input type="checkbox" name="disabled" ${u.disabled ? 'checked' : ''}> Disabled (can't sign in; signed out now)</label>` : ''}
    </div><div class="auth-err" id="userErr"></div></form>
    <div class="modal-foot"><button class="btn btn-primary" form="userForm" type="submit">${u ? 'Save' : 'Add user'}</button><button class="btn btn-plain" data-close>Cancel</button></div>`);
  card.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  const form = card.querySelector('#userForm');
  form.onsubmit = async e => {
    e.preventDefault();
    const f = form.elements;
    const body = { name: f.name.value.trim(), role: f.role.value };
    if (f.password.value) body.password = f.password.value;
    try {
      if (u) { if (f.disabled) body.disabled = f.disabled.checked; await api('PUT', `/api/users/${u.id}`, body); }
      else await api('POST', '/api/users', { ...body, username: f.username.value.trim() });
      closeModal(); toast(u ? 'User updated' : 'User added'); viewUsers(main);
    } catch (err) { card.querySelector('#userErr').textContent = err.message; }
  };
}

function viewActivity(main, openId) {
  crumbs([['Automation Platform', '#/overview'], ['Activity']]);
  main.innerHTML = `

    ${state.runs.length ? `<div class="tbl-wrap"><table class="list" id="runTable"><tr><th>Status</th><th>Workflow</th><th>Started</th><th>Duration</th><th>Nodes</th></tr>
      ${state.runs.map(r => {

        return `<tr class="clickable" data-run="${r.id}"><td>${statusLabel(r.status)}</td><td><a href="#/designer/${r.workflowId}" onclick="event.stopPropagation()">${esc(r.workflowName)}</a>${r.startedBy ? `<div class="muted" style="font-size:calc(12px * var(--fs))">by ${esc(r.startedBy)}</div>` : ''}</td>
          <td>${fmtTime(r.started)}</td><td class="num">${r.finished ? fmtDur(new Date(r.finished) - new Date(r.started)) : '…'}</td>
          <td class="num"><span style="color:var(--success)">${n('success')} ok</span> · <span style="color:var(--danger)">${n('failed')} failed</span> · <span style="color:var(--muted)">${n('skipped')} skipped</span></td></tr>
          <tr data-log="${r.id}" ${r.id === openId ? '' : 'hidden'}><td colspan="5" style="padding:0"><pre class="log">${renderLog(r)}</pre></td></tr>`;

function renderLog(r) {
  return r.log.map(([kind, text]) => `<span class="${kind}">${esc(text)}</span>`).join('\n');
}

/* =====================================================================
   Designer (workflow visualizer)

function blankWorkflow() {
  return { createdBy: ME?.id, createdByName: ME?.name, id: uid('w-'), name: 'Untitled workflow', description: '', nodes: [], edges: [], startX: 0, startY: -START_H / 2, updated: now() };
}
function newNode(wf, aid, x, y, extra = {}) {
  const ids = new Set(wf.nodes.map(n => n.id));
  let i = 1; while (ids.has('n' + i)) i++;
  const a = autoById(aid);
  return { id: 'n' + i, automationId: aid, x, y, label: '', vars: '', action: a?.type === 'terraform' ? (a.action || 'apply') : '', convergence: 'any', inventoryFrom: '', inventoryId: '', limit: '', promptHosts: false, outcome: 'success', ...extra };
}
function startDesigner(wf, dirty) {
  D = { wf, view: { x: 60, y: 300, k: 1 }, sel: null, drag: null, dirty, status: {}, taken: new Set(), running: false, legend: true, fitted: false, dock: dockPrefs() };

}

function viewDesigner(main, arg) {

  $('#dClear').onclick = () => {
    if (!D.wf.nodes.length || !confirm('Delete every node in this workflow?')) return;

  };
  $('#dSave').onclick = saveWorkflow;
  $('#dSummary').onclick = () => togglePanel('summary');
  $('#dTest').onclick = () => testRun();
  $('#dRun').onclick = () => launch();

function markDirty() {
  D.dirty = true; D.status = {}; D.taken = new Set();
  if (D.test && !D.test.running) D.test.stale = true;
  if (!D.sel && D.panel) renderSide();
  if (D.dock.tab !== 'logs') renderDock();
}

function saveWorkflow() {
  if (!D.wf.name.trim()) D.wf.name = 'Untitled workflow';
  D.wf.updated = now();
  const i = state.workflows.findIndex(w => w.id === D.wf.id);
  const copy = clone(D.wf);
  if (i >= 0) state.workflows[i] = copy; else state.workflows.push(copy);
  D.dirty = false;
  persist();
  toast('Workflow saved');
}

/* ---------- rendering ---------- */
function applyView() {
  const v = D.view;
  $('#vp').setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`);
}

function edgePath(wf, e) {
  const a = boxOf(wf, e.from), b = boxOf(wf, e.to);
  if (!a || !b) return '';
  const sx = a.x + a.w, sy = a.y + a.h / 2, tx = b.x - 2, ty = b.y + b.h / 2;
  const dx = Math.max(50, Math.abs(tx - sx) / 2);
  return `M${sx},${sy} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}`;
}

function draw() {
  if (!$('#canvas')) return;
  const wf = D.wf, st = D.status, hasRun = Object.keys(st).length > 1;
  $('#totalNodes').textContent = wf.nodes.length;
  $('#edgesG').innerHTML = wf.edges.map(e => {
    const sel = D.sel?.kind === 'edge' && D.sel.id === e.id;
    const flowing = D.taken.has(e.id) && (st[e.to] === 'running' || st[e.to] === 'waiting');
    const cls = ['edge', e.type, sel ? 'sel' : '', D.taken.has(e.id) ? 'taken' : '', flowing ? 'flowing' : '', hasRun && !D.taken.has(e.id) ? 'dim' : ''].join(' ');
    const d = edgePath(wf, e);
    // A dot travels along links into steps that are running.
    const comet = flowing ? `<circle class="comet" r="5"><animateMotion dur="1.1s" repeatCount="indefinite" path="${d}"/></circle>` : '';
    return `<g class="${cls}" data-edge="${e.id}"><path class="line" d="${d}" marker-end="url(#arr-${e.type})"/>${comet}<path class="hit" d="${d}"/></g>`;
  }).join('');

  const sp = startPos(wf);
  const startSel = D.sel?.kind === 'node' && D.sel.id === 'start';
  let html = `<g class="node start ${startSel ? 'sel' : ''} ${D.running ? 'st-running' : ''}" data-node="start" transform="translate(${sp.x},${sp.y})">
    <title>${D.running ? 'Running…' : 'Click to launch · drag to move'}</title>
    <rect class="hit" x="-6" y="-30" width="${START_W + 18}" height="${START_H + 36}"/>
    <rect class="start-box" width="${START_W}" height="${START_H}" rx="4"/>
    <text class="start-text" x="${START_W / 2}" y="${START_H / 2 + 1}">START</text>
    <circle class="port" data-port="start" cx="${START_W}" cy="${START_H / 2}" r="7"/>
    <g class="node-tools" transform="translate(${START_W - 12},-14)">${toolBtn('add', 'start', 0)}</g>
  </g>`;
  html += wf.nodes.map(n => {
    const a = autoById(n.automationId);
    const type = a?.type || 'shell';
    const sel = D.sel?.kind === 'node' && D.sel.id === n.id;
    const status = st[n.id] ? 'st-' + st[n.id] : '';
    let title = nodeName(n);
    if (title.length > 26) title = title.slice(0, 25) + '…';
    const sub = !a ? 'missing from catalog' : isApproval(n) ? (st[n.id] === 'waiting' ? 'waiting for an approver…' : n.timeout ? `approval · times out in ${n.timeout} min` : 'approval · waits for an approver')
      : type === 'terraform' ? `terraform ${nodeAction(n)}` : `${a.dir}/${a.entry}`;
    const subT = sub.length > 32 ? '…' + sub.slice(-31) : sub;
    const dot = st[n.id] === 'success' ? `<circle class="st-dot" cx="${NODE_W - 12}" cy="12" r="5" style="fill:var(--success)"/>`
      : st[n.id] === 'failed' ? `<circle class="st-dot" cx="${NODE_W - 12}" cy="12" r="5" style="fill:var(--danger)"/>` : '';
    return `<g class="node ${sel ? 'sel' : ''} ${status}" data-node="${n.id}" transform="translate(${n.x},${n.y})">
      <rect class="hit" x="-14" y="-26" width="${NODE_W + 30}" height="${NODE_H + 38}"/>
      <rect class="node-box" width="${NODE_W}" height="${NODE_H}" rx="3"/>
      <text class="node-title" x="${NODE_W / 2}" y="${NODE_H / 2 - 7}">${esc(title)}</text>
      <text class="node-sub" x="${NODE_W / 2}" y="${NODE_H / 2 + 13}">${esc(subT)}</text>
      ${dot}${issueMarker(n.id)}
      <g class="badge b-${type}" transform="translate(0,${NODE_H})"><circle r="13"/><text>${TYPES[type].badge}</text></g>
      <circle class="port" data-port="${n.id}" cx="${NODE_W}" cy="${NODE_H / 2}" r="7"/>
      <g class="node-tools" transform="translate(${NODE_W - 40},-14)">${toolBtn('add', n.id, 0)}${toolBtn('del', n.id, 26)}</g>
    </g>`;
  }).join('');
  $('#nodesG').innerHTML = html;
  applyView();
}

function issueMarker(id) {
  if (!D.test || D.test.stale || D.test.running) return '';
  const lvl = worstLevel(D.test.byNode[id] || []);
  if (lvl !== 'error' && lvl !== 'warning') return '';
  return `<g class="issue-mark ${lvl}" transform="translate(${NODE_W - 4},4)"><title>${lvl === 'error' ? 'Test run found errors' : 'Test run found warnings'}</title><circle r="10"/><text>!</text></g>`;
}

function toolBtn(kind, id, x) {
  const path = kind === 'add' ? 'M-5 0h10M0 -5v10' : 'M-4 -4l8 8M4 -4l-8 8';
  return `<g class="tool ${kind === 'del' ? 'danger' : ''}" data-tool="${kind}" data-id="${id}" transform="translate(${x},0)"><title>${kind === 'add' ? 'Add node' : 'Delete node'}</title><circle r="11"/><path d="${path}"/></g>`;
}

function fitView() {
  const wrap = $('#cwrap');
  if (!wrap) return;
  const boxes = [boxOf(D.wf, 'start'), ...D.wf.nodes.map(n => boxOf(D.wf, n.id))];
  const minX = Math.min(...boxes.map(b => b.x)) - 30, maxX = Math.max(...boxes.map(b => b.x + b.w)) + 30;
  const minY = Math.min(...boxes.map(b => b.y)) - 40, maxY = Math.max(...boxes.map(b => b.y + b.h)) + 30;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const k = Math.max(0.3, Math.min(1.2, (W - 40) / (maxX - minX), (H - 40) / (maxY - minY)));
  D.view = { k, x: (W - (maxX - minX) * k) / 2 - minX * k, y: (H - (maxY - minY) * k) / 2 - minY * k };
  applyView();
}

/* ---------- interaction ---------- */
function toWorld(ev) {
  const r = $('#canvas').getBoundingClientRect();
  return { x: (ev.clientX - r.left - D.view.x) / D.view.k, y: (ev.clientY - r.top - D.view.y) / D.view.k };
}

function bindCanvas() {
  const svg = $('#canvas');

  svg.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    closePopover();
    if (ev.target.closest('[data-tool]')) return; // handled on click
    const port = ev.target.closest('[data-port]');
    const nodeEl = ev.target.closest('[data-node]');
    const edgeEl = ev.target.closest('[data-edge]');
    if (port) {
      D.drag = { kind: 'link', from: port.dataset.port };
    } else if (nodeEl) {
      const id = nodeEl.dataset.node;
      const p = toWorld(ev);
      const b = boxOf(D.wf, id);
      D.drag = { kind: 'node', id, dx: p.x - b.x, dy: p.y - b.y, sx: ev.clientX, sy: ev.clientY, moved: false };
    } else if (edgeEl) {
      select({ kind: 'edge', id: edgeEl.dataset.edge });
      return;
    } else {
      D.drag = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, vx: D.view.x, vy: D.view.y, moved: false };
      svg.classList.add('panning');
    }
    svg.setPointerCapture(ev.pointerId);
  });

  svg.addEventListener('pointermove', ev => {
    const d = D.drag;
    if (!d) return;
    if (d.kind === 'pan') {
      if (Math.abs(ev.clientX - d.sx) + Math.abs(ev.clientY - d.sy) > 3) d.moved = true;
      D.view.x = d.vx + ev.clientX - d.sx; D.view.y = d.vy + ev.clientY - d.sy;
      applyView();
    } else if (d.kind === 'node') {
      if (!d.moved && Math.abs(ev.clientX - d.sx) + Math.abs(ev.clientY - d.sy) < 4) return;
      d.moved = true;
      const p = toWorld(ev);
      const x = Math.round(p.x - d.dx), y = Math.round(p.y - d.dy);
      if (d.id === 'start') { D.wf.startX = x; D.wf.startY = y; }
      else { const n = D.wf.nodes.find(n => n.id === d.id); n.x = x; n.y = y; }
      D.dirty = true;
      draw();
    } else if (d.kind === 'link') {
      const b = boxOf(D.wf, d.from), p = toWorld(ev);
      const sx = b.x + b.w, sy = b.y + b.h / 2;
      $('#ghost').setAttribute('d', `M${sx},${sy} C${sx + 60},${sy} ${p.x - 60},${p.y} ${p.x},${p.y}`);
    }
  });

  const end = ev => {
    const d = D.drag;
    if (!d) return;
    D.drag = null;
    svg.classList.remove('panning');
    if (d.kind === 'pan' && !d.moved) select(null);
    if (d.kind === 'node' && !d.moved) { if (d.id === 'start') launch(); else select({ kind: 'node', id: d.id }); }
    if (d.kind === 'link') {
      $('#ghost').setAttribute('d', '');
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = el && el.closest && el.closest('[data-node]');
      if (target) tryLink(d.from, target.dataset.node, ev);
    }
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', () => { D.drag = null; $('#ghost').setAttribute('d', ''); svg.classList.remove('panning'); });

  svg.addEventListener('click', ev => {
    const t = ev.target.closest('[data-tool]');
    if (!t) return;
    if (t.dataset.tool === 'add') addNodeModal(t.dataset.id);
    if (t.dataset.tool === 'del') deleteNode(t.dataset.id);
  });

  svg.addEventListener('dblclick', ev => {
    const nodeEl = ev.target.closest('[data-node]');
    if (nodeEl && nodeEl.dataset.node !== 'start') select({ kind: 'node', id: nodeEl.dataset.node });
    else if (!nodeEl && !ev.target.closest('[data-edge]')) addNodeModal(null);
  });

  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const k = Math.min(2, Math.max(0.3, D.view.k * Math.exp(-ev.deltaY * 0.0015)));
    D.view.x = mx - (mx - D.view.x) * (k / D.view.k);
    D.view.y = my - (my - D.view.y) * (k / D.view.k);
    D.view.k = k;
    applyView();
  }, { passive: false });
}

function linkProblem(from, to) {
  if (to === 'start') return 'START cannot have incoming links';
  if (from === to) return 'A node cannot link to itself';
  if (D.wf.edges.some(e => e.from === from && e.to === to)) return 'These nodes are already linked';
  if (canReach(D.wf, to, from)) return 'That link would create a loop';
  return '';
}

function tryLink(from, to, ev) {
  const problem = linkProblem(from, to);
  if (problem) { if (from !== to) toast(problem); return; }
  if (from === 'start') { addEdge(from, to, 'always'); return; }
  const wrap = $('#cwrap'), r = wrap.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.id = 'popover';
  pop.style.left = Math.min(ev.clientX - r.left, r.width - 210) + 'px';
  pop.style.top = Math.min(ev.clientY - r.top, r.height - 170) + 'px';
  pop.innerHTML = `<b>Run "${esc(nodeName(D.wf.nodes.find(n => n.id === to)))}"…</b>` +
    Object.entries(EDGE).map(([k, v]) => `<button data-type="${k}"><i style="background:${v.color}"></i>${v.label}</button>`).join('');
  pop.onclick = e => { const b = e.target.closest('[data-type]'); if (b) { addEdge(from, to, b.dataset.type); closePopover(); } };
  wrap.appendChild(pop);
}
function closePopover() { $('#popover')?.remove(); }

function addEdge(from, to, type) {
  const e = { id: uid('e'), from, to, type };
  D.wf.edges.push(e);
  markDirty(); draw();
  select({ kind: 'edge', id: e.id });
}

function deleteNode(id) {
  if (id === 'start') return;
  D.wf.nodes = D.wf.nodes.filter(n => n.id !== id);
  D.wf.edges = D.wf.edges.filter(e => e.from !== id && e.to !== id);
  D.wf.nodes.forEach(n => { if (n.inventoryFrom === id) n.inventoryFrom = ''; });
  if (D.sel?.id === id) D.sel = null;
  markDirty(); draw(); renderSide();
}
function deleteEdge(id) {
  D.wf.edges = D.wf.edges.filter(e => e.id !== id);
  if (D.sel?.id === id) D.sel = null;
  markDirty(); draw(); renderSide();
}

function select(sel) {
  if (sel?.kind === 'node' && sel.id === 'start') sel = null;
  D.sel = sel;
  draw(); renderSide(); renderDock();
}

function freeSpot(x, y) {
  const taken = (cx, cy) => D.wf.nodes.some(n => Math.abs(n.x - cx) < NODE_W && Math.abs(n.y - cy) < NODE_H + 20);
  for (let i = 0; i < 20; i++) {
    const off = Math.ceil(i / 2) * 100 * (i % 2 ? 1 : -1);
    if (!taken(x, y + off)) return { x, y: y + off };
  }
  return { x, y: y + 2100 };
}

function ancestors(id) {
  const out = new Set(), stack = [id];
  while (stack.length) {
    const c = stack.pop();
    D.wf.edges.forEach(e => { if (e.to === c && !out.has(e.from)) { out.add(e.from); stack.push(e.from); } });
  }
  out.delete('start');
  return out;
}
function isTfApply(n) { const a = autoById(n.automationId); return a?.type === 'terraform' && nodeAction(n) === 'apply'; }
function nearestTfApply(fromId) {
  const queue = [fromId], seen = new Set();
  while (queue.length) {
    const c = queue.shift();
    if (seen.has(c) || c === 'start') continue;
    seen.add(c);
    const n = D.wf.nodes.find(n => n.id === c);
    if (n && isTfApply(n)) return n.id;
    D.wf.edges.forEach(e => { if (e.to === c) queue.push(e.from); });
  }
  return '';
}

      <label class="field">Node label <span class="hint">Leave blank to use the automation name</span><input class="input" data-f="label" value="${esc(n.label)}" placeholder="${esc(a?.name || '')}"></label>
      ${a?.type === 'terraform' ? `<label class="field">Terraform action<select class="select" data-f="action">${['apply', 'plan', 'destroy'].map(x => `<option ${nodeAction(n) === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
