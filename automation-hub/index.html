/* ---------- hosts: source, limit and picker ---------- */
function hostsBlockHtml(n, a, tfSources) {
  const src = n.inventoryId ? 'inv:' + n.inventoryId : n.inventoryFrom ? 'tf:' + n.inventoryFrom : '';
  const opt = (v, label) => `<option value="${esc(v)}" ${src === v ? 'selected' : ''}>${esc(label)}</option>`;
  const inv = n.inventoryId && invById(n.inventoryId);
  const ansible = a.type === 'ansible';
  const tfGone = n.inventoryFrom && !tfSources.some(t => t.id === n.inventoryFrom);
  let hint;
  if (n.inventoryId && !inv) hint = '<span style="color:var(--danger)">This inventory was deleted. Pick another one.</span>';
  else if (inv) hint = ansible
    ? (a.group && a.group !== 'all' && !hostsOf(parseInventory(inv.content), a.group).length ? `The playbook targets [${esc(a.group)}], so every host in this inventory is added to that group for this step.` : 'The step runs with this inventory.')
    : 'The selected hosts are passed in <code>HOSTS</code>, comma separated (ansible_host when set).';
  else if (n.inventoryFrom) hint = ansible ? `Hosts are written to the [${esc(a.group || 'all')}] group.` : 'Sets TF_IPS_FILE to the JSON list of IPs from that node.';
  else hint = ansible ? 'Uses the inventory file stored with the project.' : 'Pick an inventory to pass hosts to the script in HOSTS, or a Terraform node for TF_IPS_FILE.';
  const showLimit = ansible || n.inventoryId;
  return `<div class="field" style="gap:4px"><label class="field">Hosts from
      <select class="select" id="hostSrc">
        ${opt('', ansible ? `Project inventory (${a.dir}/inventory/hosts.ini)` : 'None')}
        ${state.inventories.length ? `<optgroup label="Hub inventories">${[...state.inventories].sort((x, y) => x.name.localeCompare(y.name)).map(i => opt('inv:' + i.id, `${i.name} (${plural(parseInventory(i.content).hosts.size, 'host')})`)).join('')}</optgroup>` : ''}
        ${n.inventoryId && !inv ? opt(src, 'Deleted inventory') : ''}
        ${tfSources.length ? `<optgroup label="From Terraform">${tfSources.map(t => opt('tf:' + t.id, `IPs from ${nodeName(t)} (${t.id})`)).join('')}</optgroup>` : ''}
        ${tfGone ? opt(src, `IPs from ${n.inventoryFrom} (not upstream)`) : ''}
      </select><span class="hint">${hint}</span></label>
    <div class="host-actions"><button class="btn btn-plain btn-sm" id="hostUpload" type="button">Upload hosts…</button><a class="btn btn-plain btn-sm" href="#/inventories">Manage inventories</a></div>
    <input type="file" id="hostFile" accept="${INV_ACCEPT}" hidden></div>
    ${showLimit ? `<label class="field">Limit to <span class="hint">Hosts, groups or patterns, comma separated (<code>web*</code>, <code>!web03</code>). Empty runs on every host.</span>
      <input class="input mono" id="hostLimit" value="${esc(n.limit || '')}" placeholder="all hosts" autocomplete="off"></label>
    <div id="hostPick"></div>
    <label class="check-row"><input type="checkbox" id="hostPrompt" ${n.promptHosts ? 'checked' : ''}> Ask for hosts at launch
      <span class="hint">The exported runner reads <code>HOSTS_${n.id}</code>${n.promptHosts ? ', or asks when run in a terminal' : ''}.</span></label>` : ''}`;
}

function bindHostsBlock(side, n, a, cmd) {
  const sel = side.querySelector('#hostSrc');
  if (!sel) return;
  sel.onchange = () => {
    n.inventoryId = sel.value.startsWith('inv:') ? sel.value.slice(4) : '';
    n.inventoryFrom = sel.value.startsWith('tf:') ? sel.value.slice(3) : '';
    n.limit = '';  // host names differ between sources
    markDirty(); draw(); renderSide();
  };
  side.querySelector('#hostUpload').onclick = () => side.querySelector('#hostFile').click();
  side.querySelector('#hostFile').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const inv = await inventoryFromFile(f);
      state.inventories.push(inv);
      persist();
      Object.assign(n, { inventoryId: inv.id, inventoryFrom: '', limit: '' });
      markDirty(); draw(); renderSide();
      toast(`Added inventory "${inv.name}" (${plural(parseInventory(inv.content).hosts.size, 'host')}) and selected it`);
    } catch (err) { toast('Upload failed: ' + err.message); }
  };
  const lim = side.querySelector('#hostLimit');
  if (!lim) return;
  const box = side.querySelector('#hostPick');
  const setLimit = v => { n.limit = v; lim.value = v; markDirty(); cmd(); renderHostPick(box, n, a, setLimit); };
  lim.oninput = () => { n.limit = lim.value; markDirty(); cmd(); renderHostPick(box, n, a, setLimit); };
  side.querySelector('#hostPrompt').onchange = e => { n.promptHosts = e.target.checked; markDirty(); renderSide(); };
  renderHostPick(box, n, a, setLimit);
}

// Project inventories are stored files; their content is fetched once per file version.
const projectInventoryCache = new Map();
function pickerInventory(n, a, rerender) {
  if (n.inventoryId) {
    const inv = invById(n.inventoryId);
    return inv ? { inv: parseInventory(inv.content), label: inv.name } : { msg: '' };
  }
  if (n.inventoryFrom) return { msg: 'The IPs are only known once Terraform has run. Type addresses or patterns above to narrow them.' };
  const f = (a.files || []).find(x => /^inventory\/hosts(\.ini)?$/.test(x.path)) || (a.files || []).find(x => /^(inventory|hosts)(\.ini)?$/.test(x.path));
  if (!API.on || !f) return { msg: `Hosts in <code>${esc(a.dir)}/inventory/hosts.ini</code> can be picked here once the project's files are stored in the hub. Type hosts or groups above, or pick a hub inventory.` };
  const key = `${f.id}:${f.updated}`;
  if (!projectInventoryCache.has(key)) {
    projectInventoryCache.set(key, null);
    api('GET', `/api/files/${f.id}`).then(r => projectInventoryCache.set(key, r.content)).catch(() => projectInventoryCache.set(key, '')).then(rerender);
  }
  const content = projectInventoryCache.get(key);
  return content === null ? { msg: 'Loading the project inventory…' } : { inv: parseInventory(content), label: f.path };
}

function renderHostPick(box, n, a, setLimit) {
  if (!box) return;
  const src = pickerInventory(n, a, () => { if (box.isConnected) renderHostPick(box, n, a, setLimit); });
  if (src.msg !== undefined) { box.innerHTML = src.msg ? `<div class="muted" style="font-size:calc(12.5px * var(--fs))">${src.msg}</div>` : ''; return; }
  const inv = src.inv, all = [...inv.hosts.keys()];
  if (!all.length) { box.innerHTML = `<div class="muted" style="font-size:calc(12.5px * var(--fs))">${esc(src.label)} has no hosts yet.</div>`; return; }
  const { hosts, unknown } = resolveLimit(inv, n.limit);
  const picked = new Set(hosts), terms = limitTerms(n.limit), groups = groupNames(inv);
  const q = (box.dataset.q || '').toLowerCase();
  const shown = all.filter(h => !q || h.toLowerCase().includes(q) || String(inv.hosts.get(h).vars.ansible_host || '').includes(q));
  box.innerHTML = `<div class="host-pick">
    <div class="host-pick-head"><b>${hosts.length} of ${plural(all.length, 'host')}</b> selected<span class="muted">· ${esc(src.label)}</span>
      ${n.limit ? '<button class="btn btn-plain btn-sm" type="button" data-all>Select all</button>' : ''}</div>
    ${groups.length ? `<div class="chips">${groups.map(g => `<button type="button" class="chip ${terms.includes(g) ? 'on' : ''}" data-g="${esc(g)}">${esc(g)} <span>${hostsOf(inv, g).length}</span></button>`).join('')}</div>` : ''}
    ${all.length > 8 ? `<input class="input" data-q placeholder="Filter hosts" value="${esc(box.dataset.q || '')}">` : ''}
    <div class="host-list">${shown.map(h => {
      const r = inv.hosts.get(h);
      const meta = [r.vars.ansible_host, [...r.groups].filter(g => g !== 'ungrouped').join(', ')].filter(Boolean).join(' · ');
      return `<label class="host-row"><input type="checkbox" data-h="${esc(h)}" ${picked.has(h) ? 'checked' : ''}><span class="mono">${esc(h)}</span><span class="muted" title="${esc(meta)}">${esc(meta)}</span></label>`;
    }).join('') || '<div class="muted" style="padding:4px">No hosts match the filter.</div>'}</div>
    ${unknown.length ? `<ul class="issues"><li class="warning">Not in ${esc(src.label)}: ${unknown.map(u => `<code>${esc(u)}</code>`).join(', ')}</li></ul>` : ''}
    ${n.limit && !hosts.length ? '<ul class="issues"><li class="error">The limit matches no hosts, so this step would do nothing.</li></ul>' : ''}
  </div>`;
  box.querySelector('[data-all]')?.addEventListener('click', () => setLimit(''));
  box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = b.dataset.g;
    setLimit((terms.includes(g) ? terms.filter(t => t !== g) : [...terms.filter(t => t !== 'all'), g]).join(','));
  });
  box.querySelectorAll('[data-h]').forEach(c => c.onchange = () => {
    const h = c.dataset.h;
    if (c.checked) setLimit(terms.includes('!' + h) ? terms.filter(t => t !== '!' + h).join(',') : [...terms, h].join(','));
    else if (terms.includes(h)) setLimit(terms.filter(t => t !== h).join(','));
    else setLimit([...(terms.length ? terms : ['all']), '!' + h].join(','));
  });
  const qi = box.querySelector('[data-q]');
  if (qi) qi.oninput = () => {
    box.dataset.q = qi.value;
    renderHostPick(box, n, a, setLimit);
    const again = box.querySelector('[data-q]');
    again.focus(); again.setSelectionRange(again.value.length, again.value.length);
  };
}

/* ---------- workflow analysis: summary and test run ---------- */
const isScript = a => a.type === 'shell' || a.type === 'python';
const edgeOk = (type, s) => type === 'success' ? s === 'success' : type === 'failure' ? s === 'failed' : (s === 'success' || s === 'failed');
const LEVEL_RANK = { error: 3, warning: 2, info: 1 };
const worstLevel = list => list.reduce((w, i) => (LEVEL_RANK[i.level] || 0) > (LEVEL_RANK[w] || 0) ? i.level : w, '');
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

// Which nodes run when exactly the nodes in `failing` fail and every other node succeeds.
function planRun(wf, failing = new Set()) {
  const st = { start: 'success' };
  topo(wf).forEach(id => {
    if (id === 'start') return;
    const n = wf.nodes.find(x => x.id === id);
    const inc = wf.edges.filter(e => e.to === id);
    const sat = inc.filter(e => edgeOk(e.type, st[e.from]));
    const runs = autoById(n.automationId) && inc.length && (n.convergence === 'all' ? sat.length === inc.length : sat.length > 0);
    st[id] = !runs ? 'skipped' : failing.has(id) ? 'failed' : 'success';
  });
  return st;
}

function describeWorkflow(wf) {
  const order = topo(wf).filter(id => id !== 'start');
  const depth = { start: 0 };
  topo(wf).forEach(id => wf.edges.filter(e => e.from === id).forEach(e => { depth[e.to] = Math.max(depth[e.to] ?? 0, depth[id] + 1); }));
  const connected = order.filter(id => wf.edges.some(e => e.to === id));
  const happy = planRun(wf);
  const happyIds = order.filter(id => happy[id] === 'success');
  const failures = happyIds.map(id => {
    const st = planRun(wf, new Set([id]));
    return {
      id,
      handled: wf.edges.some(e => e.from === id && e.type !== 'success'),
      recovery: order.filter(x => st[x] === 'success' && happy[x] !== 'success'),
      lost: order.filter(x => happy[x] === 'success' && st[x] === 'skipped'),
    };
  });
  // Steps on the all-succeed path, by stage; steps that only run after a failure are listed apart.
  const stages = [];
  happyIds.forEach(id => (stages[depth[id] - 1] ||= []).push(id));
  const onFailure = connected.filter(id => happy[id] !== 'success');
  const types = {};
  wf.nodes.forEach(n => { const t = autoById(n.automationId)?.type; if (t) types[t] = (types[t] || 0) + 1; });
  return { order, happyIds, failures, stages: stages.filter(Boolean), onFailure, types,
           disconnected: wf.nodes.filter(n => !wf.edges.some(e => e.to === n.id)).map(n => n.id) };
}

function wfNodeName(wf, id) { return id === 'start' ? 'START' : nodeName(wf.nodes.find(n => n.id === id)); }

function whenText(wf, n, plain) {
  const inc = wf.edges.filter(e => e.to === n.id);
  const nm = id => plain ? `${id} ${wfNodeName(wf, id)}` : `<b>${esc(wfNodeName(wf, id))}</b>`;
  if (!inc.length) return 'never (not connected to START)';
  const part = e => e.from === 'start' ? 'when the workflow starts'
    : e.type === 'success' ? `when ${nm(e.from)} succeeds` : e.type === 'failure' ? `if ${nm(e.from)} fails` : `after ${nm(e.from)} finishes, either way`;
  if (inc.length === 1) return part(inc[0]);
  return (n.convergence === 'all' ? 'only when all of these happen: ' : 'as soon as any of these happens: ') + inc.map(part).join('; ');
}

function doesText(wf, n) {
  const a = autoById(n.automationId);
  if (!a) return 'Nothing: the automation was removed from the catalog.';
  const vars = Object.entries({ ...parseVars(a.vars), ...parseVars(n.vars) });
  const vlist = vars.map(([k, v]) => `<code>${esc(k)}=${esc(v)}</code>`).join(' ');
  const src = n.inventoryFrom && wf.nodes.find(x => x.id === n.inventoryFrom);
  const inv = n.inventoryId && invById(n.inventoryId);
  const lim = (n.limit || '').trim() ? `, limited to <code>${esc(n.limit.trim())}</code>` : '';
  const ask = n.promptHosts ? ' Asks for the hosts at launch.' : '';
  const where = `<code>${esc(a.dir)}/${esc(a.entry)}</code>`;
  if (a.type === 'terraform') {
    const act = nodeAction(n);
    return `${act === 'apply' ? 'Creates or updates' : act === 'destroy' ? 'Destroys' : 'Previews changes to'} the infrastructure in <code>${esc(a.dir)}</code> with <code>terraform ${act}</code>${vlist ? ', using ' + vlist : ''}.` +
      (act === 'apply' ? ' Saves the <code>ip_addresses</code> output for later steps.' : '');
  }
  if (a.type === 'ansible') {
    return `Runs the playbook ${where} against ${src ? `the IPs created by <b>${esc(nodeName(src))}</b>, as group <code>${esc(a.group || 'all')}</code>`
      : inv ? `the hosts in the hub inventory <b>${esc(inv.name)}</b>`
      : n.inventoryId ? 'a hub inventory that was deleted'
      : `the hosts in <code>${esc(a.dir)}/inventory/hosts.ini</code>${a.group ? `, group <code>${esc(a.group)}</code>` : ''}`}${lim}${vlist ? ', with extra vars ' + vlist : ''}.${ask}`;
  }
  if (isApproval(n)) return `Pauses the run until an approver approves it${n.timeout ? ` (or ${n.timeout} min pass, which counts as rejected)` : ''}.${n.instructions ? ` Instructions: <i>${esc(n.instructions)}</i>` : ''}`;
  if (a.type === 'eda') return `Starts the rulebook listener ${where}. It keeps running until it is stopped, so the steps after it wait for it.`;
  return `Runs the ${TYPES[a.type].short} script ${where}${src ? ` with the IPs from <b>${esc(nodeName(src))}</b> in <code>TF_IPS_FILE</code>` : ''}${inv ? ` with the hosts from <b>${esc(inv.name)}</b>${lim} in <code>HOSTS</code>` : ''}${vlist ? ', with ' + vlist : ''}.${inv ? ask : ''}`;
}

function thenText(wf, n) {
  const out = wf.edges.filter(e => e.from === n.id);
  if (!out.length) return 'This is the last step on its path.';
  const by = t => out.filter(e => e.type === t).map(e => `<b>${esc(wfNodeName(wf, e.to))}</b>`);
  const labels = isApproval(n) ? [['success', 'If approved'], ['failure', 'If rejected'], ['always', 'Either way']] : [['success', 'If it succeeds'], ['failure', 'If it fails'], ['always', 'Either way']];
  return labels
    .filter(([t]) => by(t).length).map(([t, l]) => `${l}: ${by(t).join(', ')}`).join('. ') + '.';
}

function summaryHtml(wf) {
  if (!wf.nodes.length) return `<p class="muted">Add a node from START with <b>+</b>. This panel then describes, step by step, what the workflow will do.</p>`;
  const d = describeWorkflow(wf);
  const typeList = Object.entries(d.types).map(([t, c]) => `${c} ${TYPES[t].short}`).join(', ');
  const parallel = d.stages.some(s => s.length > 1);
  const unhandled = d.failures.filter(f => !f.handled);
  const handoffs = {};
  wf.nodes.forEach(n => { if (n.inventoryFrom && wf.nodes.some(x => x.id === n.inventoryFrom)) (handoffs[n.inventoryFrom] ||= []).push(n); });
  const nodeCard = id => {
    const n = wf.nodes.find(x => x.id === id), a = autoById(n.automationId);
    return `<div class="sum-node" data-goto="${id}">
      <div class="sum-title">${a ? typeLogo(a.type, 22) : ''}<b>${esc(nodeName(n))}</b><span class="muted mono">${id}</span></div>
      <div><span class="sum-k">When</span>${cap(whenText(wf, n))}.</div>
      <div><span class="sum-k">Does</span>${doesText(wf, n)}</div>
      ${a?.description ? `<div class="muted">${esc(a.description)}</div>` : ''}
      <div><span class="sum-k">Then</span>${thenText(wf, n)}</div>
    </div>`;
  };
  return `
    <p class="sum-lead"><b>${esc(wf.name)}</b> has ${plural(wf.nodes.length, 'step')}${typeList ? ` (${typeList})` : ''}.
      When every step succeeds, ${plural(d.happyIds.length, 'step')} run in ${plural(d.stages.length, 'stage')}${parallel ? ', some side by side' : ', one after another'}.</p>
    ${d.happyIds.length ? `<div class="sum-path">${d.happyIds.map(id => `<span data-goto="${id}">${esc(wfNodeName(wf, id))}</span>`).join('<i>→</i>')}</div>` : ''}
    <h4>Step by step</h4>
    ${d.stages.map((ids, i) => `<div class="sum-stage">Stage ${i + 1}${ids.length > 1 ? ' · these run at the same time' : ''}</div>${ids.map(nodeCard).join('')}`).join('')}
    ${d.onFailure.length ? `<div class="sum-stage">Only when something fails</div>${d.onFailure.map(nodeCard).join('')}` : ''}
    <h4>If something fails</h4>
    <ul class="sum-list">${d.failures.map(f => f.handled
      ? `<li class="ok">If <b>${esc(wfNodeName(wf, f.id))}</b> fails, ${f.recovery.length ? `<b>${f.recovery.map(x => esc(wfNodeName(wf, x))).join(', ')}</b> run${f.recovery.length === 1 ? 's' : ''}` : 'the failure is handled'}${f.lost.length ? ` and ${plural(f.lost.length, 'later step')} ${f.lost.length === 1 ? 'is' : 'are'} skipped` : ''}.</li>`
      : `<li class="bad">If <b>${esc(wfNodeName(wf, f.id))}</b> fails, nothing handles it: ${f.lost.length ? `${plural(f.lost.length, 'later step')} ${f.lost.length === 1 ? 'is' : 'are'} skipped and ` : ''}the workflow is marked failed.</li>`).join('') || '<li>No steps run yet.</li>'}</ul>
    ${unhandled.length ? `<p class="muted">${plural(unhandled.length, 'step')} have no failure path. Add an <span style="color:var(--danger)">on failure</span> link to clean up or alert.</p>` : ''}
    ${Object.keys(handoffs).length ? `<h4>Data passed between steps</h4><ul class="sum-list">${Object.entries(handoffs).map(([src, ns]) =>
      `<li><b>${esc(wfNodeName(wf, src))}</b> saves its <code>ip_addresses</code> output; ${ns.map(n => `<b>${esc(nodeName(n))}</b>`).join(', ')} use${ns.length === 1 ? 's' : ''} those IPs as ${ns.every(n => autoById(n.automationId)?.type === 'ansible') ? 'their inventory' : 'their hosts'}.</li>`).join('')}</ul>` : ''}
    ${d.disconnected.length ? `<h4>Not connected</h4><ul class="sum-list">${d.disconnected.map(id => `<li class="bad" data-goto="${id}"><b>${esc(wfNodeName(wf, id))}</b> never runs: no link leads to it.</li>`).join('')}</ul>` : ''}
    <p class="muted">Use <b>Test run</b> to check it for errors, and <b>Export → Bash runner</b> for the exact commands.</p>`;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function graphChecks(wf) {
  const W = [], N = {};
  const add = (id, level, text) => (N[id] ||= []).push({ level, text, line: null });
  const nm = id => wfNodeName(wf, id);
  if (!wf.nodes.length) W.push({ level: 'error', text: 'The workflow has no steps. Add one from START with +.' });
  else if (!wf.edges.some(e => e.from === 'start')) W.push({ level: 'error', text: 'Nothing is linked to START, so nothing would run.' });
  wf.nodes.forEach(n => {
    const a = autoById(n.automationId);
    const inc = wf.edges.filter(e => e.to === n.id);
    if (!a) add(n.id, 'error', 'The automation behind this step was removed from the catalog.');
    if (!inc.length) add(n.id, 'error', 'Not connected: no link leads here, so this step never runs.');
    if (n.convergence === 'all' && inc.length > 1) {
      const byParent = {};
      inc.forEach(e => (byParent[e.from] ||= new Set()).add(e.type));
      if (Object.values(byParent).some(t => t.has('success') && t.has('failure')))
        add(n.id, 'error', 'Waits for all parent paths, but needs one step to both succeed and fail, so it can never run.');
    }
    if (n.inventoryFrom) {
      const src = wf.nodes.find(x => x.id === n.inventoryFrom);
      if (!src) add(n.id, 'error', 'Takes its hosts from a step that no longer exists.');
      else if (!isTfApply(src)) add(n.id, 'error', `Takes its hosts from ${nm(src.id)}, which is not a Terraform apply, so there is no ip_addresses output.`);
      else if (!ancestors(n.id).has(src.id)) add(n.id, 'error', `Takes its hosts from ${nm(src.id)}, which doesn't run before this step.`);
      else if (planRun(wf, new Set([src.id]))[n.id] === 'success') add(n.id, 'warning', `Can run even when ${nm(src.id)} fails, and then there are no IPs to use.`);
    }
    if (n.inventoryId) {
      const inv = invById(n.inventoryId);
      if (!inv) add(n.id, 'error', 'Its hub inventory was deleted. Pick another one under Hosts from.');
      else {
        const p = parseInventory(inv.content), r = resolveLimit(p, n.limit);
        if (!p.hosts.size) add(n.id, 'error', `Inventory "${inv.name}" has no hosts, so this step would do nothing.`);
        else if (!r.hosts.length) add(n.id, 'error', `The host limit "${n.limit}" matches no hosts in "${inv.name}", so this step would do nothing.`);
        r.unknown.forEach(t => add(n.id, 'warning', `"${t}" in the host limit is not a host or group in "${inv.name}".`));
        p.problems.forEach(x => add(n.id, 'warning', `Inventory "${inv.name}" line ${x.line}: ${x.text}.`));
      }
    }
    if (isApproval(n) && !wf.edges.some(e => e.from === n.id))
      add(n.id, 'warning', 'Nothing runs after this approval, so approving or rejecting it changes nothing.');
    if (isApproval(n) && n.timeout && !/^\d+(\.\d+)?$/.test(String(n.timeout).trim()))
      add(n.id, 'error', 'The timeout must be a number of minutes.');
    if (a?.type === 'eda' && wf.edges.some(e => e.from === n.id))
      add(n.id, 'warning', 'A rulebook keeps listening until it is stopped, so the steps after it only start once it exits.');
    if (n.outcome && n.outcome !== 'success')
      add(n.id, 'info', `Launch is set to make this step ${n.outcome === 'failure' ? 'fail' : 'fail at random'}. That only affects the simulation.`);
  });
  const tf = wf.nodes.filter(n => autoById(n.automationId)?.type === 'terraform');
  tf.forEach((x, i) => tf.slice(i + 1).forEach(y => {
    const dir = autoById(x.automationId).dir;
    if (dir === autoById(y.automationId).dir && !canReach(wf, x.id, y.id) && !canReach(wf, y.id, x.id)) {
      add(x.id, 'warning', `Can run at the same time as ${nm(y.id)} in the same folder (${dir}); Terraform would fail on the state lock.`);
      add(y.id, 'warning', `Can run at the same time as ${nm(x.id)} in the same folder (${dir}); Terraform would fail on the state lock.`);
    }
  }));
  const unhandled = describeWorkflow(wf).failures.filter(f => !f.handled).length;
  if (unhandled) W.push({ level: 'info', text: `${plural(unhandled, 'step')} have no failure path. If one fails, the run stops there and is marked failed.` });
  return { workflow: W, byNode: N };
}

async function testRun() {
  const wf = D.wf;
  D.panel = 'test'; D.sel = null;
  D.test = { running: true };
  $('#dTest').disabled = true;
  draw(); renderSide();
  const graph = graphChecks(wf);
  let server = null, serverError = null;
  if (API.on && wf.nodes.length) {
    try { await flushSync(); server = await api('POST', '/api/test-workflow', { workflow: wf }); }
    catch (e) { serverError = e.message; }
  }
  if (!D || D.wf !== wf) return; // left the visualizer meanwhile
  const byNode = {};
  wf.nodes.forEach(n => { byNode[n.id] = [...(graph.byNode[n.id] || []), ...(server?.nodes?.[n.id]?.issues || [])]; });
  if (server) Object.values(server.validations).forEach(v => {
    const a = autoById(v.automation_id);
    if (a) a.validation = { status: v.status, checked: v.checked, stale: false, counts: v.counts };
  });
  D.test = { running: false, stale: false, checked: now(), workflow: graph.workflow, byNode, server, serverError };
  $('#dTest').disabled = false;
  draw(); renderSide();
  const all = [...graph.workflow, ...Object.values(byNode).flat()];
  const e = all.filter(i => i.level === 'error').length, w = all.filter(i => i.level === 'warning').length;
  toast(e ? `Test run: ${plural(e, 'error')}, ${plural(w, 'warning')}` : w ? `Test run passed with ${plural(w, 'warning')}` : 'Test run passed: no problems found');
}

function issueList(list) {
  return list.length ? `<ul class="issues">${list.map(i => `<li class="${i.level}">${i.line ? `<code>line ${i.line}</code> ` : ''}${esc(i.text)}</li>`).join('')}</ul>` : '';
}

function validationDetails(v, limit = 8) {
  if (!v) return '';
  const rows = [];
  v.checks.forEach(c => c.messages.filter(m => m.level !== 'info' || v.files.length).forEach(m =>
    rows.push({ level: m.level, html: `<code>${esc(m.file || c.target)}${m.line ? ':' + m.line : ''}</code> ${esc(m.text)} <span class="muted">(${esc(c.tool)})</span>` })));
  v.files.forEach(f => f.messages.filter(m => m.level !== 'info').forEach(m =>
    rows.push({ level: m.level, path: f.path, line: m.line, html: `<code>${esc(f.path)}${m.line ? ':' + m.line : ''}</code> ${esc(m.text)} <span class="muted">(${esc(f.tool)})</span>` })));
  rows.sort((a, b) => (LEVEL_RANK[b.level] || 0) - (LEVEL_RANK[a.level] || 0));
  const seen = new Set();  // the same problem is often reported by two tools (e.g. terraform fmt and validate)
  for (let i = rows.length - 1; i >= 0; i--) {
    const key = rows[i].html.replace(/<span class="muted">.*?<\/span>/, '');
    if (seen.has(key)) rows.splice(i, 1); else seen.add(key);
  }
  const c = v.counts;
  return `${rows.length ? `<ul class="issues">${rows.slice(0, limit).map(r => `<li class="${r.level}"${r.path ? ` data-open-file="${esc(r.path)}" data-line="${r.line || ''}"` : ''}>${r.html}</li>`).join('')}</ul>` : ''}
    ${rows.length > limit ? `<div class="muted">…and ${rows.length - limit} more</div>` : ''}
    <div class="muted" style="font-size:calc(12px * var(--fs))">${plural(c.files, 'file')} checked: ${c.ok} ok${c.warning ? `, ${c.warning} with warnings` : ''}${c.error ? `, ${c.error} with errors` : ''}${c.skipped ? `, ${c.skipped} without a checker` : ''}</div>`;
}

function testHtml() {
  const t = D.test;
  if (!t) return `<p>A test run checks this workflow <b>without running anything</b>: no commands are executed and no hosts or cloud APIs are contacted.</p>
    <ul class="sum-list"><li>Links, unreachable steps and hand-offs between steps</li><li>Syntax of every stored file (YAML, playbooks, Terraform, Bash, Python, Jinja, JSON, inventories)</li>
    <li>Required Terraform variables that have no value</li><li>Inventories with no hosts</li><li>Tools that are missing on this machine</li></ul>
    ${API.on ? '' : '<p class="muted">Without <code>./runner.sh</code> only the workflow structure is checked.</p>'}
    <button class="btn btn-primary" data-rerun>${ICON.check} Run the test</button>`;
  if (t.running) return `<div class="banner run"><span class="spin"></span>Checking syntax, variables, inventories and tools…</div>`;
  const nodeIssues = Object.values(t.byNode).flat();
  const all = [...t.workflow, ...nodeIssues];
  const e = all.filter(i => i.level === 'error').length, w = all.filter(i => i.level === 'warning').length;
  const order = [...topo(D.wf).filter(id => id !== 'start'), ...D.wf.nodes.map(n => n.id)].filter((id, i, arr) => arr.indexOf(id) === i);
  const tools = t.server?.tools;
  return `
    <div class="banner ${e ? 'bad' : w ? 'warn' : 'ok'}">${e ? `${plural(e, 'error')} and ${plural(w, 'warning')} found` : w ? `No errors, ${plural(w, 'warning')}` : (API.on ? 'No problems found. The workflow is ready to run.' : 'No structural problems found')}</div>
    <div class="muted" style="font-size:calc(12px * var(--fs))">Checked ${fmtTime(t.checked)}. Nothing was executed and no hosts were contacted.</div>
    ${t.stale ? '<ul class="issues"><li class="warning">The workflow changed after this test. Run it again to check the changes.</li></ul>' : ''}
    ${!API.on ? '<ul class="issues"><li class="info">Only the structure was checked. Start <code>./runner.sh</code> to also check syntax, Terraform variables, inventories and tools.</li></ul>' : ''}
    ${t.serverError ? `<ul class="issues"><li class="error">Server checks failed: ${esc(t.serverError)}</li></ul>` : ''}
    <button class="btn btn-secondary btn-sm" data-rerun style="justify-self:start">${ICON.check} Run again</button>
    ${t.workflow.length ? `<h4>Workflow</h4>${issueList(t.workflow)}` : ''}
    <h4>Steps</h4>
    ${order.map(id => {
      const n = D.wf.nodes.find(x => x.id === id), a = autoById(n.automationId);
      const list = t.byNode[id] || [];
      const lvl = worstLevel(list);
      const v = a && t.server?.validations?.[a.id];
      return `<div class="test-node ${lvl}">
        <div class="sum-title" data-goto="${id}">${a ? typeLogo(a.type, 22) : ''}<b>${esc(nodeName(n))}</b><span class="pill ${lvl || 'ok'}">${lvl === 'error' ? 'error' : lvl === 'warning' ? 'warning' : 'ok'}</span></div>
        ${issueList(list.filter(i => !/^Syntax check (failed|passed with warnings)/.test(i.text)))}
        ${v ? `<div data-auto="${a.id}">${validationDetails(v, 6)}</div>` : ''}
      </div>`;
    }).join('')}
    ${tools ? `<h4>Tools on this machine</h4><table class="tools">${Object.entries(tools).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${v ? esc(v) : '<span style="color:var(--warn)">not installed</span>'}</td></tr>`).join('')}</table>` : ''}`;
}

function nodeIssuesHtml(id) {
  if (!D.test || D.test.running) return '';
  const list = D.test.byNode[id] || [];
  const n = D.wf.nodes.find(x => x.id === id), a = n && autoById(n.automationId);
  const v = a && D.test.server?.validations?.[a.id];
  if (!list.length && !(v && v.status !== 'ok')) return '';
  return `<div><h4 style="margin-bottom:6px">Test run${D.test.stale ? ' (before your last change)' : ''}</h4>${issueList(list.filter(i => !/^Syntax check/.test(i.text)))}${v && v.status !== 'ok' ? `<div data-auto="${a.id}">${validationDetails(v, 5)}</div>` : ''}</div>`;
}

function togglePanel(kind) {
  D.panel = D.panel === kind && !D.sel ? null : kind;
  D.sel = null;
  draw(); renderSide();
}

function renderPanel(side) {
  const t = D.test;
  const n = t && !t.running ? [...t.workflow, ...Object.values(t.byNode).flat()].filter(i => i.level === 'error').length : 0;
  side.innerHTML = `
    <div class="side-head"><div class="ptabs">
      <button data-ptab="summary" class="${D.panel === 'summary' ? 'on' : ''}">Summary</button>
      <button data-ptab="test" class="${D.panel === 'test' ? 'on' : ''}">Test run${n ? ` <span class="pill error">${n}</span>` : ''}</button></div>
      <button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="side-body">${D.panel === 'summary' ? summaryHtml(D.wf) : testHtml()}</div>`;
  side.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => { D.panel = b.dataset.ptab; renderSide(); });
  side.querySelector('[data-close]').onclick = () => { D.panel = null; renderSide(); };
  side.querySelectorAll('[data-rerun]').forEach(b => b.onclick = () => testRun());
  bindPanelLinks(side);
}

function bindPanelLinks(el) {
  el.querySelectorAll('[data-goto]').forEach(g => g.onclick = () => select({ kind: 'node', id: g.dataset.goto }));
  el.querySelectorAll('[data-open-file]').forEach(li => li.onclick = e => {
    e.stopPropagation();
    const aid = li.closest('[data-auto]')?.dataset.auto;
    const f = autoById(aid)?.files?.find(x => x.path === li.dataset.openFile);
    if (f) fileEditor(aid, f.id, +li.dataset.line || null);
  });
}

function summaryLines(wf) {
  const d = describeWorkflow(wf);
  const lines = ['# What it does, in run order:'];
  [...d.stages.flat(), ...d.onFailure].forEach(id => {
    const n = wf.nodes.find(x => x.id === id), a = autoById(n.automationId);
    lines.push(`#   ${id} ${nodeName(n)}${a ? ` [${TYPES[a.type].short}${a.type === 'terraform' ? ' ' + nodeAction(n) : ''}]` : ''}, ${whenText(wf, n, true)}`);
  });
  const unhandled = d.failures.filter(f => !f.handled).map(f => f.id);
  if (unhandled.length) lines.push(`# Failures in ${unhandled.join(', ')} are not handled and fail the workflow.`);
  return lines;
}

/* ---------- dock: logs, details and problems below the canvas ---------- */
const DOCK_KEY = KEY + '.dock';
function dockPrefs() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem(DOCK_KEY) || '{}'); } catch (e) { /* storage unavailable */ }
  return { tab: ['logs', 'details', 'problems'].includes(p.tab) ? p.tab : 'details', collapsed: !!p.collapsed,
           height: Math.min(600, Math.max(120, +p.height || 250)), runId: null, filter: '' };
}
function saveDockPrefs() {
  try { localStorage.setItem(DOCK_KEY, JSON.stringify({ tab: D.dock.tab, collapsed: D.dock.collapsed, height: D.dock.height })); } catch (e) { /* ignore */ }
}

function setDockCollapsed(v) {
  D.dock.collapsed = v;
  const dock = $('#dock');
  if (dock) { dock.classList.toggle('collapsed', v); dock.style.height = v ? '' : D.dock.height + 'px'; }
  saveDockPrefs();
  renderDock();
}

let dockQueued = false;
function queueDock() {
  if (dockQueued) return;
  dockQueued = true;
  requestAnimationFrame(() => { dockQueued = false; renderDock(); });
}
let dockClock = null;
function startDockClock() { stopDockClock(); dockClock = setInterval(() => { const el = $('#dockElapsed'); if (el) el.textContent = elapsedText(); }, 250); }
function stopDockClock() { clearInterval(dockClock); dockClock = null; }

function dockRuns() { return D ? state.runs.filter(r => r.workflowId === D.wf.id) : []; }
function dockRun() { const runs = dockRuns(); return runs.find(r => r.id === D.dock.runId) || runs[0] || null; }
function elapsedText() {
  const r = dockRun();
  if (!r) return '';
  return fmtDur((r.finished ? new Date(r.finished) : new Date()) - new Date(r.started));
}
function stepStatus(r, id) {
  if (!r) return '';
  if (r.status === 'running' && D.wf.id === r.workflowId) return D.status[id] || 'pending';
  return r.nodes[id] || '';
}
function stepDuration(r, id) {
  const t = r?.times?.[id];
  if (!t) return '';
  return fmtDur((t.end || Date.now()) - t.start);
}

function bindDock() {
  const handle = $('#dockResize'), dock = $('#dock');
  handle.addEventListener('pointerdown', ev => {
    if (D.dock.collapsed) return;
    const y0 = ev.clientY, h0 = dock.offsetHeight;
    const max = () => Math.max(160, dock.parentElement.clientHeight - 140);
    handle.setPointerCapture(ev.pointerId);
    const move = e => { D.dock.height = Math.round(Math.min(max(), Math.max(120, h0 + y0 - e.clientY))); dock.style.height = D.dock.height + 'px'; };
    const up = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); saveDockPrefs(); };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
  $('#dockHead').addEventListener('click', e => {
    const tab = e.target.closest('[data-dtab]');
    if (tab) { D.dock.tab = tab.dataset.dtab; if (D.dock.collapsed) setDockCollapsed(false); else { saveDockPrefs(); renderDock(); } return; }
    if (e.target.closest('#dockToggle')) setDockCollapsed(!D.dock.collapsed);
    if (e.target.closest('#dockCopy')) { const r = dockRun(); if (r) copyText(dockLogLines(r).map(l => l[1]).join('\n')); }
    if (e.target.closest('#dockTest')) testRun();
  });
  $('#dockHead').addEventListener('change', e => {
    if (e.target.id === 'dockRunSel') { D.dock.runId = e.target.value || null; renderDock(); }
    if (e.target.id === 'dockFilter') { D.dock.filter = e.target.value; renderDock(); }
  });
  $('#dockBody').addEventListener('click', e => {
    const g = e.target.closest('[data-goto]');
    if (g) { select({ kind: 'node', id: g.dataset.goto }); return; }
    if (e.target.closest('[data-dock-launch]')) launch();
    if (e.target.closest('[data-dock-test]')) testRun();
    if (e.target.closest('[data-dock-logs]')) { D.dock.tab = 'logs'; D.dock.filter = e.target.closest('[data-dock-logs]').dataset.dockLogs; renderDock(); }
  });
}

function dockLogLines(r) {
  const f = D.dock.filter;
  return f ? r.log.filter(l => l[2] === f) : r.log;
}

function renderDock() {
  const head = $('#dockHead'), body = $('#dockBody');
  if (!head || !D) return;
  const runs = dockRuns(), r = dockRun();
  const t = D.test;
  const problems = t && !t.running ? [...t.workflow, ...Object.values(t.byNode).flat()].filter(i => i.level === 'error' || i.level === 'warning').length : 0;
  const tab = D.dock.tab;
  const keep = document.activeElement && head.contains(document.activeElement) ? document.activeElement.id : null;
  head.innerHTML = `
    <div class="dock-tabs">
      <button data-dtab="logs" class="${tab === 'logs' ? 'on' : ''}">Logs</button>
      <button data-dtab="details" class="${tab === 'details' ? 'on' : ''}">Details</button>
      <button data-dtab="problems" class="${tab === 'problems' ? 'on' : ''}">Problems${problems ? ` <span class="pill ${t.byNode && Object.values(t.byNode).flat().concat(t.workflow).some(i => i.level === 'error') ? 'error' : 'warning'}">${problems}</span>` : ''}</button>
    </div>
    ${r ? `<span class="dock-run">${statusLabel(r.status)} <span id="dockElapsed" class="mono">${elapsedText()}</span>${r.status === 'running' ? '' : ` <span class="muted">· ${fmtTime(r.started)}</span>`}</span>` : ''}
    <span style="flex:1"></span>
    ${!D.dock.collapsed && tab === 'logs' && r ? `
      <select class="select dock-sel" id="dockFilter" title="Show one step"><option value="">All steps</option>${D.wf.nodes.map(n => `<option value="${n.id}" ${D.dock.filter === n.id ? 'selected' : ''}>${esc(n.id)} · ${esc(nodeName(n))}</option>`).join('')}</select>
      ${runs.length > 1 ? `<select class="select dock-sel" id="dockRunSel" title="Choose a run">${runs.map((x, i) => `<option value="${i === 0 ? '' : x.id}" ${x === r ? 'selected' : ''}>${i === 0 ? 'Latest run' : fmtTime(x.started) + ' · ' + x.status}</option>`).join('')}</select>` : ''}
      <button class="btn btn-plain btn-sm" id="dockCopy">Copy</button>` : ''}
    ${!D.dock.collapsed && tab === 'problems' && t && !t.running ? `<button class="btn btn-plain btn-sm" id="dockTest">${ICON.check} Run again</button>` : ''}
    <button class="icon-btn" id="dockToggle" title="${D.dock.collapsed ? 'Show the panel' : 'Hide the panel'}" aria-label="Toggle panel">${D.dock.collapsed ? ICON.chevUp : ICON.chevDown}</button>`;
  if (keep && $('#' + keep)) $('#' + keep).focus();
  if (D.dock.collapsed) { body.innerHTML = ''; return; }

  if (tab === 'logs') {
    const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 12;
    if (!r) {
      body.innerHTML = `<div class="dock-empty">No runs yet. Click <b>START</b> on the canvas or <button class="btn btn-secondary btn-sm" data-dock-launch>${ICON.play} Launch</button> to simulate a run; its log streams here.</div>`;
      return;
    }
    const lines = dockLogLines(r);
    body.innerHTML = `<pre class="log dock-log">${lines.map(([kind, text, id]) => `<span class="${kind}">${esc(text)}</span>`).join('\n') || '<span class="dim">No log lines for this step in this run.</span>'}${r.status === 'running' ? '\n<span class="dim cursor">▍</span>' : ''}</pre>`;
    if (atBottom || r.status === 'running') body.scrollTop = body.scrollHeight;
    return;
  }

  if (tab === 'problems') {
    if (!t) { body.innerHTML = `<div class="dock-empty">No test run yet. <button class="btn btn-secondary btn-sm" data-dock-test>${ICON.check} Test run</button> checks syntax, variables, inventories and tools without running anything.</div>`; return; }
    if (t.running) { body.innerHTML = `<div class="dock-empty"><span class="spin"></span> Checking…</div>`; return; }
    const rows = [...t.workflow.map(i => ({ ...i, id: null })), ...Object.entries(t.byNode).flatMap(([id, list]) => list.map(i => ({ ...i, id })))]
      .filter(i => i.level !== 'info').sort((a, b) => (LEVEL_RANK[b.level] || 0) - (LEVEL_RANK[a.level] || 0));
    body.innerHTML = `${t.stale ? '<div class="dock-note">The workflow changed after this test; run it again to check the changes.</div>' : ''}
      ${rows.length ? `<table class="list dock-table"><tr><th style="width:90px">Level</th><th style="width:30%">Step</th><th>Problem</th></tr>
        ${rows.map(i => `<tr ${i.id ? `class="clickable" data-goto="${i.id}"` : ''}><td><span class="label ${i.level === 'error' ? 'failed' : 'warning'}">${i.level}</span></td>
          <td>${i.id ? esc(wfNodeName(D.wf, i.id)) : '<span class="muted">Workflow</span>'}</td><td>${esc(i.text)}</td></tr>`).join('')}</table>`
        : `<div class="dock-empty">${API.on ? 'No problems found in the last test run.' : 'No structural problems found. Start ./runner.sh to also check syntax and variables.'}</div>`}`;
    return;
  }

  // Details: the selected step or link, otherwise every step of the workflow.
  const sel = D.sel;
  if (sel?.kind === 'node') {
    const n = D.wf.nodes.find(x => x.id === sel.id);
    if (!n) { D.sel = null; return renderDock(); }
    const a = autoById(n.automationId);
    const st = stepStatus(r, n.id);
    const vars = a ? Object.entries({ ...parseVars(a.vars), ...parseVars(n.vars) }) : [];
    const lines = r ? r.log.filter(l => l[2] === n.id) : [];
    body.innerHTML = `<div class="dock-details">
      <div class="dd-col">
        <div class="sum-title">${a ? typeLogo(a.type, 22) : ''}<b>${esc(nodeName(n))}</b><span class="muted mono">${n.id}</span>${st ? statusLabel(st) : ''}</div>
        <dl class="props">
          <dt>Type</dt><dd>${a ? TYPES[a.type].label + (a.type === 'terraform' ? ' · ' + nodeAction(n) : '') : '<span style="color:var(--danger)">missing from catalog</span>'}</dd>
          <dt>Project</dt><dd class="mono">${a && a.dir ? esc(a.dir + '/' + a.entry) : '—'}</dd>
          <dt>Runs</dt><dd>${esc(cap(whenText(D.wf, n, true)))}</dd>
          ${hostable(n) ? `<dt>Hosts</dt><dd>${esc(hostsText(D.wf, n))}</dd>` : ''}
          ${n.inventoryFrom ? `<dt>Input</dt><dd>IPs from ${esc(wfNodeName(D.wf, n.inventoryFrom))}</dd>` : ''}
          <dt>Variables</dt><dd>${vars.length ? vars.map(([k, v]) => `<code>${esc(k)}=${esc(v)}</code>`).join(' ') : '<span class="muted">none</span>'}</dd>
          ${r && stepDuration(r, n.id) ? `<dt>Duration</dt><dd class="mono">${stepDuration(r, n.id)}</dd>` : ''}
        </dl>
        ${a && nodeCommand(D.wf, n) ? `<div class="cmd-box mono">$ cd ${esc(a.dir)} && ${esc(nodeCommand(D.wf, n))}</div>` : ''}
        ${isApproval(n) && n.instructions ? `<div class="muted">${esc(n.instructions)}</div>` : ''}
      </div>
      <div class="dd-col">
        <div class="dd-sub">Log from the ${r ? (r === dockRuns()[0] ? 'latest' : 'selected') + ' run' : 'last run'} ${lines.length ? `<button class="btn btn-plain btn-sm" data-dock-logs="${n.id}">Open in Logs</button>` : ''}</div>
        ${lines.length ? `<pre class="log">${lines.map(([kind, text]) => `<span class="${kind}">${esc(text)}</span>`).join('\n')}</pre>`
          : `<div class="muted">${r ? 'This step did not run in that run.' : 'Not run yet.'}</div>`}
        ${D.test && !D.test.running && (D.test.byNode[n.id] || []).length ? `<div class="dd-sub">Test run</div>${issueList(D.test.byNode[n.id])}` : ''}
      </div></div>`;
    return;
  }
  if (sel?.kind === 'edge') {
    const e = D.wf.edges.find(x => x.id === sel.id);
    if (!e) { D.sel = null; return renderDock(); }
    const taken = r && r.log.some(l => l[2] === e.to) && edgeOk(e.type, stepStatus(r, e.from));
    body.innerHTML = `<div class="dock-details"><div class="dd-col">
      <div class="sum-title"><b>${esc(wfNodeName(D.wf, e.from))}</b> → <b>${esc(wfNodeName(D.wf, e.to))}</b></div>
      <dl class="props"><dt>Condition</dt><dd><span style="color:${EDGE[e.type].color}">${EDGE[e.type].label}</span>: ${esc(nodeName(D.wf.nodes.find(x => x.id === e.to)))} runs ${e.from === 'start' ? 'when the workflow starts' : e.type === 'success' ? `when ${esc(wfNodeName(D.wf, e.from))} succeeds` : e.type === 'failure' ? `if ${esc(wfNodeName(D.wf, e.from))} fails` : `after ${esc(wfNodeName(D.wf, e.from))} finishes`}.</dd>
      ${r ? `<dt>Last run</dt><dd>${taken ? 'This link was followed.' : 'This link was not followed.'}</dd>` : ''}</dl></div></div>`;
    return;
  }
  if (!D.wf.nodes.length) { body.innerHTML = `<div class="dock-empty">Add a step from START with <b>+</b>. Details of every step appear here.</div>`; return; }
  const order = [...topo(D.wf).filter(id => id !== 'start'), ...D.wf.nodes.map(n => n.id)].filter((id, i, arr) => arr.indexOf(id) === i);
  body.innerHTML = `<table class="list dock-table">
    <tr><th style="width:44px">Step</th><th>Name</th><th>Type</th><th>Runs</th><th>Hosts / input</th><th style="width:100px">${r ? 'Status' : ''}</th><th style="width:70px">${r ? 'Time' : ''}</th></tr>
    ${order.map(id => {
      const n = D.wf.nodes.find(x => x.id === id), a = autoById(n.automationId);
      const st = stepStatus(r, id);
      const host = hostable(n) ? hostsText(D.wf, n) : n.inventoryFrom ? `IPs from ${wfNodeName(D.wf, n.inventoryFrom)}` : '—';
      return `<tr class="clickable" data-goto="${id}"><td class="mono">${id}</td><td>${esc(nodeName(n))}</td>
        <td>${a ? TYPES[a.type].short + (a.type === 'terraform' ? ' ' + nodeAction(n) : '') : '—'}</td>
        <td>${esc(cap(whenText(D.wf, n, true)))}</td><td>${esc(host)}</td>
        <td>${st ? statusLabel(st) : ''}</td><td class="num mono">${stepDuration(r, id)}</td></tr>`;
    }).join('')}</table>`;
}

/* ---------- export ---------- */
function exportModal() {
  const wf = D.wf;
  const json = JSON.stringify({ ...clone(wf), automations: state.automations.filter(a => wf.nodes.some(n => n.automationId === a.id)),
    inventories: state.inventories.filter(i => wf.nodes.some(n => n.inventoryId === i.id)) }, null, 2);
  const bash = runnerScript(wf);
  const slug = (wf.name || 'workflow').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'workflow';
  let tab = 'bash';
  const card = openModal(`
    <div class="modal-head"><h2>Export workflow</h2><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="tabs"><button data-tab="bash" class="on">Bash runner</button><button data-tab="json">JSON</button></div>
      <p id="exNote" style="margin:0 0 10px;color:var(--muted);font-size:calc(13px * var(--fs))"></p>
      <textarea class="code" id="exCode" readonly spellcheck="false"></textarea>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" id="exDl">Download</button><button class="btn btn-secondary" id="exCopy">Copy</button><button class="btn btn-plain" data-close>Close</button></div>`, true);
  const show = () => {
    card.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    card.querySelector('#exCode').value = tab === 'bash' ? bash : json;
    card.querySelector('#exNote').innerHTML = tab === 'bash'
      ? `Save as <code>${slug}.sh</code> in the repository root and run <code>bash ${slug}.sh</code>. Needs bash 4+, plus terraform / ansible / python3 for the node types used.`
      : 'Includes the catalog entries and inventories this workflow uses, so it can be imported into another hub.';
  };
  show();
  card.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; show(); } };
  card.querySelector('#exDl').onclick = () => tab === 'bash' ? download(slug + '.sh', bash, 'text/x-shellscript') : download(slug + '.json', json, 'application/json');
  card.querySelector('#exCopy').onclick = () => copyText(tab === 'bash' ? bash : json);
  card.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
}

/* ---------- simulated launch ---------- */
// Steps marked "Ask for hosts at launch" get their host limit for this run only.
function askHosts(wf) {
  const ask = wf.nodes.filter(n => n.promptHosts && hostable(n) && wf.edges.some(e => e.to === n.id));
  if (!ask.length) return Promise.resolve({});
  return new Promise(resolve => {
    const card = openModal(`
      <div class="modal-head"><h2>Hosts for this run</h2><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
      <form class="modal-body" id="ahForm">
        <p class="muted" style="margin-top:0">These steps ask for their hosts at launch. Changes apply to this run only.</p>
        <div style="display:grid;gap:14px">${ask.map(n => {
          const inv = n.inventoryId && invById(n.inventoryId), p = inv && parseInventory(inv.content);
          return `<label class="field">${esc(nodeName(n))} <span class="mono muted">${n.id}</span>
            <input class="input mono" name="${n.id}" value="${esc(n.limit || '')}" placeholder="all hosts" list="ah-${n.id}" autocomplete="off">
            <span class="hint" data-ah="${n.id}">${esc(hostsText(wf, n))}</span>
            ${p ? `<datalist id="ah-${n.id}">${[...groupNames(p), ...p.hosts.keys()].map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}</label>`;
        }).join('')}</div>
      </form>
      <div class="modal-foot"><button class="btn btn-primary" type="submit" form="ahForm">${ICON.play} Launch</button><button class="btn btn-plain" data-close>Cancel</button></div>`);
    const form = card.querySelector('#ahForm');
    form.oninput = e => {
      const n = ask.find(x => x.id === e.target.name);
      if (n) card.querySelector(`[data-ah="${n.id}"]`).textContent = hostsText(wf, n, e.target.value);
    };
    card.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { closeModal(); resolve(null); });
    form.onsubmit = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(form));
      closeModal();
      resolve(Object.fromEntries(ask.map(n => [n.id, f[n.id].trim()])));
    };
    form.querySelector('input').focus();
  });
}

// Approval steps: with the hub server, a request goes to the Approvals page and this page waits
// for an approver's decision. Opened as a file there are no approvers, so the launcher decides.
async function waitForApproval(wf, run, n, note) {
  if (!API.on) {
    return new Promise(resolve => {
      const card = openModal(`
        <div class="modal-head"><h2>${esc(nodeName(n))}</h2></div>
        <div class="modal-body"><p>The run of <b>${esc(wf.name)}</b> is waiting for approval.</p>${n.instructions ? `<p class="muted">${esc(n.instructions)}</p>` : ''}
          <p class="muted" style="font-size:calc(13px * var(--fs))">Opened as a file there are no approvers, so you decide here. Start <code>./runner.sh</code> to send approvals to approvers.</p>
          <label class="field">Comment<input class="input" id="apComment" placeholder="Optional"></label></div>
        <div class="modal-foot"><button class="btn btn-primary" data-d="approved">Approve</button><button class="btn btn-danger" data-d="rejected">Reject</button></div>`);
      card.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const comment = card.querySelector('#apComment').value; closeModal(); resolve({ status: b.dataset.d, comment, decided_by_name: 'you' }); });
    });
  }
  let req;
  try {
    req = await api('POST', '/api/approvals', { runId: run.id, workflowId: wf.id, workflowName: wf.name, nodeId: n.id,
      stepName: nodeName(n), instructions: n.instructions || '', timeoutMinutes: String(n.timeout || '').trim() || null });
  } catch (e) { note('could not create the approval request: ' + e.message); return { status: 'rejected', comment: e.message }; }
  note(`request sent to approvers${n.timeout ? `; times out in ${n.timeout} min` : ''}. Approve it on the Approvals page.`);
  refreshApprovalCount();
  for (;;) {
    await sleep(2000);
    try {
      const r = await api('GET', `/api/approvals/${req.id}`);
      if (r.status !== 'pending') { refreshApprovalCount(); return r; }
    } catch (e) { /* keep waiting through short outages */ }
  }
}

async function launch() {
  if (D.running) return;
  const wf = D.wf;
  if (!wf.nodes.length) { toast('Add at least one node first'); return; }
  const hostsFor = await askHosts(wf);
  if (!hostsFor || !D || D.wf !== wf) return;
  if (D.dirty) saveWorkflow();
  D.running = true;
  $('#dRun').disabled = true;
  const wfId = wf.id;
  const status = { start: 'success' };
  const taken = new Set();
  const t0 = Date.now();
  const stamp = () => new Date().toTimeString().slice(0, 8);
  const run = { id: uid('r-'), workflowId: wf.id, workflowName: wf.name, started: now(), finished: null, status: 'running', nodes: {}, times: {}, log: [], startedBy: ME?.name };
  const log = (kind, text, nodeId) => { run.log.push(nodeId ? [kind, text, nodeId] : [kind, text]); queueDock(); };
  state.runs.unshift(run);
  state.runs = state.runs.slice(0, 50);
  log('dim', `# Simulated run of "${wf.name}" — no commands are executed in the browser.`);

  const sync = () => {
    if (D && D.wf.id === wfId) { D.status = { ...status }; D.taken = new Set(taken); draw(); queueDock(); }
  };
  if (D.dock.collapsed) setDockCollapsed(false);
  D.dock.runId = null;  // follow the new run
  D.dock.tab = 'logs';
  D.dock.filter = '';
  startDockClock();
  const edgeOk = (type, s) => type === 'success' ? s === 'success' : type === 'failure' ? s === 'failed' : (s === 'success' || s === 'failed');
  const resolved = s => s === 'success' || s === 'failed' || s === 'skipped';
  const incoming = id => wf.edges.filter(e => e.to === id);
  const remaining = new Set(wf.nodes.map(n => n.id));
  const running = new Set();
  sync();

  await new Promise(resolve => {
    const start = async id => {
      const n = wf.nodes.find(x => x.id === id), a = autoById(n.automationId);
      const inc = incoming(id);
      const sat = inc.filter(e => edgeOk(e.type, status[e.from]));
      const runIt = a && inc.length && (n.convergence === 'all' ? sat.length === inc.length : sat.length > 0);
      if (!runIt) {
        status[id] = 'skipped';
        log('dim', `[${stamp()}] -- ${id} ${nodeName(n)}: skipped${!inc.length ? ' (not connected)' : !a ? ' (automation missing)' : ''}`, id);
      } else {
        running.add(id);
        sat.forEach(e => taken.add(e.id));
        if (isApproval(n)) {
          status[id] = 'waiting'; run.times[id] = { start: Date.now() }; sync();
          log('', `[${stamp()}] ⏸ ${id} ${nodeName(n)}: waiting for approval`, id);
          if (n.instructions) log('dim', `  instructions: ${n.instructions}`, id);
          const d = await waitForApproval(wf, run, n, line => log('dim', '  ' + line, id));
          const ok = d.status === 'approved';
          status[id] = ok ? 'success' : 'failed';
          run.times[id].end = Date.now();
          log(ok ? 'ok' : 'bad', `  ${ok ? '✔ approved' : d.status === 'expired' ? '✘ timed out' : '✘ ' + d.status}${d.decided_by_name ? ' by ' + d.decided_by_name : ''}${d.comment ? `: "${d.comment}"` : ''} after ${fmtDur(run.times[id].end - run.times[id].start)}`, id);
          running.delete(id);
          sync(); pump();
          return;
        }
        status[id] = 'running'; run.times[id] = { start: Date.now() }; sync();
        log('', `[${stamp()}] ▶ ${id} ${nodeName(n)} (${TYPES[a.type].label})`, id);
        log('dim', `  started ${whenText(wf, n, true)}`, id);
        log('cmd', `  $ cd ${a.dir} && ${nodeCommand(wf, n, { hosts: hostsFor[id] })}`, id);
        if (hostable(n)) log('dim', `  hosts: ${hostsText(wf, n, hostsFor[id] ?? n.limit)}`, id);
        const dur = ({ terraform: 2200, ansible: 1500, eda: 900, shell: 900, python: 900 }[a.type]) + Math.random() * 700;
        await sleep(dur);
        const failed = n.outcome === 'failure' || (n.outcome === 'random' && Math.random() < 0.3);
        status[id] = failed ? 'failed' : 'success';
        run.times[id].end = Date.now();
        log(failed ? 'bad' : 'ok', `  ${failed ? '✘ failed' : '✔ successful'} in ${(dur / 1000).toFixed(1)}s`, id);
        running.delete(id);
      }
      sync();
      pump();
    };
    const pump = () => {
      for (const id of [...remaining]) {
        if (remaining.has(id) && incoming(id).every(e => resolved(status[e.from]))) { remaining.delete(id); start(id); }
      }
      if (!remaining.size && !running.size) resolve();
    };
    pump();
  });

  const unhandled = wf.nodes.filter(n => status[n.id] === 'failed' && !wf.edges.some(e => e.from === n.id && e.type !== 'success'));
  run.status = unhandled.length ? 'failed' : 'success';
  run.finished = now();
  wf.nodes.forEach(n => run.nodes[n.id] = status[n.id] || 'skipped');
  log(run.status === 'success' ? 'ok' : 'bad', `\n# Workflow ${run.status === 'success' ? 'successful' : 'failed'} in ${fmtDur(Date.now() - t0)}` +
    (unhandled.length ? ` — unhandled failure in ${unhandled.map(n => n.id).join(', ')}` : ''));
  persist();
  if (D && D.wf.id === wfId) { D.running = false; const b = $('#dRun'); if (b) b.disabled = false; draw(); }
  stopDockClock();
  renderDock();
  toast(`Run ${run.status === 'success' ? 'successful' : 'failed'} · see Activity for the log`);
}

/* =====================================================================
   Global wiring
   ===================================================================== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePopover(); closeModal(); closeDrawer(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (!D || !$('#canvas') || ['input', 'textarea', 'select'].includes(tag) || $('#modal').classList.contains('open')) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && D.sel) {
    e.preventDefault();
    D.sel.kind === 'node' ? deleteNode(D.sel.id) : deleteEdge(D.sel.id);
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveWorkflow(); }
});
window.addEventListener('beforeunload', e => { if (D && D.dirty) { e.preventDefault(); e.returnValue = ''; } });

$('#burger').onclick = () => $('#sidebar').classList.toggle('open');

$('#globalSearch').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  catalogState.q = e.target.value; catalogState.type = 'all';
  if (location.hash === '#/catalog') viewCatalog($('#main')); else go('#/catalog');
});

$('#themeBtn').onclick = () => {
  const cur = effectiveTheme();
  setDisplay({ theme: cur === 'dark' || crtTheme(cur) ? 'light' : 'dark' });
  if (location.hash === '#/settings') viewSettings($('#main'));
};
applyDisplay(DISPLAY);

$('#exportHub').onclick = async () => {
  try {
    const data = API.on ? (await flushSync(), await api('GET', '/api/export')) : state;
    download('automation-hub-backup.json', JSON.stringify(data, null, 2), 'application/json');
  } catch (e) { toast('Backup failed: ' + e.message); }
};
$('#importHub').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let s;
  try {
    s = JSON.parse(await f.text());
    if (!Array.isArray(s.automations) || !Array.isArray(s.workflows)) throw new Error('bad backup');
  } catch (err) { toast('That file is not a hub backup'); return; }
  if (!confirm('Replace everything in this hub with the backup?')) return;
  try {
    if (API.on) { await api('POST', '/api/reset', s); await refreshFromServer(); }
    else { setState(s); persist(); }
    D = null; onRoute(); toast('Hub restored');
  } catch (err) { toast('Restore failed: ' + err.message); }
};
$('#resetHub').onclick = async () => {
  if (!confirm('Replace the hub with the sample automations and workflows?' + (API.on ? ' Stored files are re-imported from the repository.' : ''))) return;
  try {
    if (API.on) { await api('POST', '/api/reset', seed()); await api('POST', '/api/sync-repo'); await refreshFromServer(); }
    else { state = seed(); persist(); }
    D = null; onRoute(); toast('Sample data restored');
  } catch (err) { toast('Reset failed: ' + err.message); }
};
document.addEventListener('visibilitychange', () => { if (document.hidden && syncTimer) flushSync({}, true); });

boot();
</script>
